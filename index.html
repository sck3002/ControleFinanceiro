<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Financeiro">
<meta name="theme-color" content="#1F4734">
<title>Meu Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8;
  --paper:#FFFFFF;
  --ink:#131A2B;
  --ink-soft:#707686;
  --primary:#15193B;
  --primary-light:#3550A0;
  --accent:#2FD495;
  --accent-soft:#E4FBF1;
  --entrada:#12B76A;
  --saida:#F04438;
  --line:#E8EAF0;
  --radius:20px;
  --shadow-sm:0 2px 10px rgba(19,26,43,.06);
  --shadow-md:0 10px 30px rgba(19,26,43,.12);
  --shadow-lg:0 20px 50px rgba(19,26,43,.22);
  --ease:cubic-bezier(.22,.68,0,1);
}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes sheetOut{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(24px) scale(.98);}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.fade-page{animation:fadeSlideIn .32s var(--ease);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);}
body{-webkit-tap-highlight-color:transparent;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

header.topbar{background:linear-gradient(135deg,var(--primary) 0%,#1E2456 100%);color:#fff;padding:20px 16px 8px;position:sticky;top:0;z-index:10;}
header.topbar h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.35rem;letter-spacing:.01em;}
header.topbar .sub{font-size:.7rem;opacity:.65;margin-top:2px;text-transform:uppercase;letter-spacing:.14em;}

.balances{display:flex;flex-direction:column;gap:6px;padding:10px 16px 6px;}
.balance-row{display:flex;gap:6px;flex-wrap:wrap;}
.balance-card{flex:1;min-width:90px;background:var(--paper);border-radius:16px;padding:8px 11px;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
.balance-card .label{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
.balance-card .value{font-family:'Fraunces',Georgia,serif;font-size:.92rem;font-weight:600;margin-top:1px;}
.balance-card.total{background:linear-gradient(135deg,var(--primary) 0%,#232A5C 100%);color:#fff;border-color:transparent;padding:14px 16px;flex-basis:100%;box-shadow:var(--shadow-md);}
.balance-card.total .label{color:rgba(255,255,255,.65);}
.balance-card.total .value{font-size:1.4rem;}
.balance-card .value.neg{color:var(--saida);}
.balance-card.total .value.neg{color:#ffb4a8;}

main{flex:1;padding:12px 16px 108px;}
nav.bottomnav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;margin:0 auto;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.6);border-radius:24px;display:flex;z-index:20;padding:6px;box-shadow:var(--shadow-lg);}
nav.bottomnav button{flex:1;background:none;border:none;padding:8px 2px 6px;font-size:.56rem;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;cursor:pointer;line-height:1.1;text-align:center;border-radius:16px;transition:background .2s var(--ease),color .2s var(--ease);}
nav.bottomnav button.active{color:var(--primary);font-weight:700;background:var(--accent-soft);}
nav.bottomnav .icon{font-size:1.2rem;transition:transform .2s var(--ease);}
nav.bottomnav button.active .icon{transform:translateY(-1px) scale(1.08);}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.card.compact{padding:10px 12px;margin-bottom:8px;}
h2.section-title{font-family:'Fraunces',Georgia,serif;font-size:1.05rem;margin-bottom:10px;color:var(--primary);}
.card.compact h2.section-title{font-size:.85rem;margin-bottom:6px;letter-spacing:.02em;}
h2.section-title small{display:block;font-family:'Inter',sans-serif;font-size:.65rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-top:2px;}

label{display:block;font-size:.7rem;color:var(--ink-soft);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
.compact-form label{margin:6px 0 3px;font-size:.62rem;}
.compact-form input,.compact-form select{padding:7px 10px;font-size:.88rem;}
.compact-form .btn-row{margin-top:8px;}
.compact-form .btn{padding:9px;font-size:.85rem;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff;font-family:inherit;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent);}

.segmented{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px;}
.segmented button{flex:1;padding:10px 4px;border:none;background:#fff;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line);}
.segmented button:last-child{border-right:none;}
.segmented button.active{background:var(--primary);color:#fff;}

.btn{display:block;width:100%;padding:13px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-size:.95rem;font-weight:700;font-family:inherit;margin-top:14px;cursor:pointer;text-align:center;box-shadow:var(--shadow-sm);transition:transform .12s var(--ease),box-shadow .12s var(--ease);}
.btn:active{transform:scale(.97);}
.btn.secondary{background:var(--accent-soft);color:var(--primary);border:1px solid transparent;box-shadow:none;}
.btn.danger{background:var(--saida);}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);box-shadow:none;}
.btn.small{padding:9px 12px;font-size:.78rem;margin-top:0;width:auto;display:inline-block;}
.btn-row{display:flex;gap:8px;margin-top:14px;}
.btn-row .btn{margin-top:0;flex:1;}
.link-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;}

.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.chip{position:relative;display:inline-flex;align-items:center;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s var(--ease);}
.chip input{position:absolute;opacity:0;pointer-events:none;}
.chip:has(input:checked){background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--shadow-sm);}

.lancamento-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:10px;cursor:pointer;}
.lancamento-item:last-child{border-bottom:none;}
.lancamento-item .info{flex:1;min-width:0;}
.lancamento-item .hist{font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lancamento-item .meta{font-size:.66rem;color:var(--ink-soft);margin-top:1px;}
.lancamento-item .meta.saida{color:var(--saida);font-weight:600;}
.lancamento-item .valor{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:.88rem;white-space:nowrap;}
.valor.entrada{color:var(--entrada);}
.valor.saida{color:var(--saida);}

.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:.88rem;line-height:1.5;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,17,32,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:overlayIn .22s var(--ease);}
.modal-overlay.closing{animation:overlayOut .18s var(--ease) forwards;}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px 28px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:sheetIn .28s var(--ease);}
.modal-overlay.closing .modal{animation:sheetOut .18s var(--ease) forwards;}
.modal h3{font-family:'Fraunces',Georgia,serif;color:var(--primary);margin-bottom:4px;font-size:1.1rem;}
.modal .note{font-size:.75rem;color:var(--ink-soft);margin-top:8px;line-height:1.4;}

.splash-overlay{position:fixed;inset:0;background:rgba(10,11,20,.68);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px;animation:overlayIn .25s var(--ease);}
.splash-overlay.closing{animation:overlayOut .18s var(--ease) forwards;}
.splash{background:var(--paper);width:100%;max-width:460px;border-radius:24px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:popIn .32s var(--ease);}
.splash-overlay.closing .splash{animation:sheetOut .18s var(--ease) forwards;}
.splash-header{background:linear-gradient(135deg,var(--primary) 0%,#1E2456 100%);color:#fff;padding:18px 18px 14px;}
.splash-header h2{font-family:'Fraunces',Georgia,serif;font-size:1.2rem;margin-bottom:2px;}
.splash-header p{font-size:.78rem;opacity:.8;}
.splash-body{flex:1;overflow-y:auto;padding:12px 14px;}
.splash-footer{padding:10px 14px 14px;border-top:1px solid var(--line);}
.splash-section-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-soft);margin:10px 0 4px;}
.splash-section-label:first-child{margin-top:0;}
.splash-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:10px;margin-bottom:4px;cursor:pointer;gap:10px;transition:background .15s;}
.splash-item:hover,.splash-item:active{background:var(--line);}
.splash-item.atrasado{background:rgba(166,67,47,.08);}
.splash-item.hoje{background:rgba(194,142,44,.1);}
.splash-item.embreve{background:rgba(31,71,52,.07);}
.splash-item .si-desc{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.splash-item .si-meta{font-size:.68rem;color:var(--ink-soft);margin-top:1px;}
.splash-item .si-valor{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:.92rem;white-space:nowrap;color:var(--saida);}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:.85rem;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

table.report{width:100%;border-collapse:collapse;font-size:.78rem;}
table.report th,table.report td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;}
table.report th{font-size:.62rem;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.04em;}
table.report td.num,table.report th.num{text-align:right;font-family:'Fraunces',Georgia,serif;}
table.report tr.total-row td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;}
table.report tr.saldo-row td{font-weight:700;background:#FBF8F0;}
.table-wrap{overflow-x:auto;}

.filters-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}

.list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px;cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.list-row .name{flex:1;font-size:.9rem;font-weight:600;}
.list-row .sub{font-size:.68rem;color:var(--ink-soft);margin-top:1px;}
.tag{font-size:.62rem;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap;}
.tag.entrada,.tag.receita{background:rgba(47,125,92,.13);color:var(--entrada);}
.tag.saida,.tag.despesa{background:rgba(166,67,47,.13);color:var(--saida);}
.tag.ambos{background:rgba(194,142,44,.16);color:var(--accent);}
.tag.aberta{background:rgba(194,142,44,.16);color:var(--accent);}
.tag.fechada{background:rgba(31,71,52,.1);color:var(--primary);}
.tag.paga{background:rgba(47,125,92,.13);color:var(--entrada);}

.icon-btn{background:none;border:none;font-size:1rem;color:var(--ink-soft);cursor:pointer;padding:4px;}

.summary-row{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;}
.summary-row.bold{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;}

.mais-grid{display:flex;flex-direction:column;gap:8px;}
.mais-item{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;}
.mais-item .icon{font-size:1.3rem;}
.mais-item .txt{flex:1;}
.mais-item .txt .t{font-weight:700;font-size:.92rem;}
.mais-item .txt .d{font-size:.7rem;color:var(--ink-soft);margin-top:1px;}

.chart-wrap{position:relative;height:200px;margin-top:6px;}

@media (min-width:860px){
  #app{max-width:760px;box-shadow:0 0 0 1px var(--line);}
  header.topbar{border-radius:0;}
  .balances{flex-direction:row;}
  main{padding:16px 24px 96px;}
  table.report{font-size:.85rem;}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 id="pageTitle">Meu Financeiro</h1>
    <div class="sub" id="pageSub">Controle de contas, cartões e investimentos</div>
  </header>
  <main id="main"></main>
  <nav class="bottomnav">
    <button data-tab="inicio"><span class="icon">🏠</span>Início</button>
    <button data-tab="lancar"><span class="icon">➕</span>Lançar</button>
    <button data-tab="cartoes"><span class="icon">💳</span>Cartões</button>
    <button data-tab="relatorios"><span class="icon">📊</span>Relatórios</button>
    <button data-tab="mais"><span class="icon">☰</span>Mais</button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="splashRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO DO SUPABASE
   Cole aqui a URL e a chave (anon/publishable) do projeto NOVO
   criado com o arquivo schema_app_financeiro.sql
============================================================ */
const SUPABASE_URL = 'https://twnahmjcowveqldjjdbd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r7NBmI-QQJQUFpwZzQkhBw_bdoXbt6_';
const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   CONSTANTES
============================================================ */
const DEFAULT_CATEGORIAS = [
  {nome:'Salário', tipo:'receita'},
  {nome:'Outras receitas', tipo:'receita'},
  {nome:'Alimentação', tipo:'despesa'},
  {nome:'Moradia', tipo:'despesa'},
  {nome:'Transporte', tipo:'despesa'},
  {nome:'Saúde', tipo:'despesa'},
  {nome:'Lazer', tipo:'despesa'},
  {nome:'Outras despesas', tipo:'despesa'},
];
const TIPOS_CONTA = {caixa:'Caixa', banco:'Banco', outro:'Outro'};
const BANCOS_COMUNS = ['Nubank','Itaú','Bradesco','Banco do Brasil','Caixa Econômica','Santander','Inter','C6 Bank','PicPay','Outro'];

let state = {
  tab: 'inicio',
  session: null,
  orgId: null,
  orgNome: '',
  saldosDataBase: null,
  contas: [],
  categorias: [],
  lancamentos: [],
  cartoes: [],
  faturas: [],
  compras: [],
  parcelasCartao: [],
  investimentos: [],
  aportes: [],
  compromissos: [],
  parcelasCompromisso: [],
  authError: null,
  authLoading: false,
  authMode: 'login',
  lancarTipo: 'receita',
  compromissoTipo: 'parcelado',
  reportFilters: null,
  reportResult: null,
  onboardingSaldos: false,
};

/* ============================================================
   UTILITÁRIOS
============================================================ */
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function isoFromDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function firstDayOfMonthISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function nomeMesAno(iso){
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [y,m] = iso.split('-');
  return `${meses[parseInt(m,10)-1]} de ${y}`;
}
function addDaysISO(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return isoFromDate(d);
}
function addMonthsISO(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const ref = new Date(y, (m-1)+n, 1);
  const lastDay = new Date(ref.getFullYear(), ref.getMonth()+1, 0).getDate();
  const day = Math.min(d, lastDay);
  return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function formatMoeda(v){
  return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function formatDataBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function parseValor(str){
  str = String(str||'').trim();
  if(str === '') return 0;
  if(str.includes(',')){
    str = str.replace(/\./g,'').replace(',', '.');
  }
  const v = parseFloat(str);
  return isNaN(v) ? 0 : v;
}
function round2(v){ return Math.round(v*100)/100; }
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}
function triggerPageFade(el){
  el.classList.remove('fade-page');
  void el.offsetWidth;
  el.classList.add('fade-page');
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function toCSV(rows){
  const BOM = '\uFEFF';
  return BOM + rows.map(r=>r.map(c=>{
    c = (c===null||c===undefined)?'':String(c);
    if(c.includes(';')||c.includes('"')||c.includes('\n')){
      c = '"'+c.replace(/"/g,'""')+'"';
    }
    return c;
  }).join(';')).join('\r\n');
}
function categoriaNome(id){
  const c = state.categorias.find(x=>x.id===id);
  return c ? c.nome : '—';
}
function contaNome(id){
  const c = state.contas.find(x=>x.id===id);
  return c ? c.nome : '—';
}
function cartaoNome(id){
  const c = state.cartoes.find(x=>x.id===id);
  return c ? c.nome : '—';
}

/* ============================================================
   BANCO DE DADOS (Supabase — schema multi-tenant)
============================================================ */
const TABLES_COM_ORG = new Set(['lancamentos','categorias','contas_financeiras','cartoes_credito','investimentos','compromissos']);

async function dbGetAll(table, order){
  let q = sbClient.from(table).select('*');
  if(order) q = q.order(order.col, {ascending: order.asc !== false});
  const { data, error } = await q;
  if(error){
    console.error(table, error);
    showToast('Erro ao carregar dados.');
    return [];
  }
  return data || [];
}
async function dbAdd(table, obj){
  const payload = TABLES_COM_ORG.has(table) ? {...obj, organizacao_id: state.orgId} : obj;
  const { data, error } = await sbClient.from(table).insert(payload).select().single();
  if(error){
    console.error(table, error);
    showToast('Erro ao salvar.');
    throw error;
  }
  return data;
}
async function dbPut(table, obj){
  const { data, error } = await sbClient.from(table).upsert(obj, {onConflict:'id'}).select().single();
  if(error){
    console.error(table, error);
    showToast('Erro ao atualizar.');
    throw error;
  }
  return data;
}
async function dbDelete(table, id){
  const { error } = await sbClient.from(table).delete().eq('id', id);
  if(error){
    console.error(table, error);
    showToast('Erro ao excluir.');
    throw error;
  }
}

/* ============================================================
   SALDOS
============================================================ */
function saldoConta(contaId){
  const conta = state.contas.find(c=>c.id===contaId);
  if(!conta) return 0;
  let saldo = Number(conta.saldo_inicial)||0;
  for(const l of state.lancamentos){
    if(l.conta_financeira_id !== contaId) continue;
    if(l.data < state.saldosDataBase) continue;
    saldo += (l.tipo === 'receita' ? Number(l.valor) : -Number(l.valor));
  }
  return saldo;
}
function saldoTotal(){
  return state.contas.reduce((acc,c)=>acc + saldoConta(c.id), 0);
}
function valorTotalInvestido(){
  let total = 0;
  for(const inv of state.investimentos){
    const aportesInv = state.aportes.filter(a=>a.investimento_id===inv.id).sort((a,b)=>a.data.localeCompare(b.data));
    if(aportesInv.length===0) continue;
    const ultimo = aportesInv[aportesInv.length-1];
    total += Number(ultimo.valor_atual != null ? ultimo.valor_atual : ultimo.valor_aportado);
  }
  return total;
}

const TABS_MAIS = ['investimentos','compromissos','categorias','contas','config'];

function setTab(tab){
  state.tab = tab;

}
function render(){
  const nav = document.querySelector('nav.bottomnav');

  if(!state.session){
    nav.style.display = 'none';
    document.getElementById('pageTitle').textContent = 'Meu Financeiro';
    document.getElementById('pageSub').textContent = 'Cadastre-se ou entre na sua conta';
    const mainAuth = document.getElementById('main');
    mainAuth.innerHTML = renderAuth();
    triggerPageFade(mainAuth);
    afterRenderAuth();
    return;
  }

  if(state.onboardingSaldos){
    nav.style.display = 'none';
    document.getElementById('pageTitle').textContent = 'Bem-vindo(a)!';
    document.getElementById('pageSub').textContent = state.orgNome;
    const mainOnb = document.getElementById('main');
    mainOnb.innerHTML = renderOnboardingSaldos();
    triggerPageFade(mainOnb);
    afterRenderOnboardingSaldos();
    return;
  }

  nav.style.display = '';
  document.querySelectorAll('nav.bottomnav button').forEach(b=>{
    const isMais = b.dataset.tab === 'mais' && TABS_MAIS.includes(state.tab);
    b.classList.toggle('active', b.dataset.tab === state.tab || isMais);
  });

  const main = document.getElementById('main');
  const titles = {
    inicio:['Meu Financeiro', state.orgNome],
    lancar:['Novo Lançamento','Registrar receita, despesa ou transferência'],
    cartoes:['Cartões de Crédito','Faturas, parcelas e compras'],
    relatorios:['Relatórios','Detalhado ou consolidado por período'],
    mais:['Mais','Investimentos, compromissos e configurações'],
    investimentos:['Investimentos','Aportes e valor atual'],
    compromissos:['Compromissos','Contas fixas, parceladas e recorrentes'],
    categorias:['Categorias','Padronização para os relatórios'],
    contas:['Contas','Caixa, bancos e outras contas'],
    config:['Configurações','Saldos iniciais, organização e backup'],
  };
  const t = titles[state.tab] || titles.inicio;
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];

  switch(state.tab){
    case 'inicio': main.innerHTML = renderInicio(); break;
    case 'lancar': main.innerHTML = renderLancar(); break;
    case 'cartoes': main.innerHTML = renderCartoes(); break;
    case 'relatorios': main.innerHTML = renderRelatorios(); break;
    case 'mais': main.innerHTML = renderMais(); break;
    case 'investimentos': main.innerHTML = renderInvestimentos(); break;
    case 'compromissos': main.innerHTML = renderCompromissos(); break;
    case 'categorias': main.innerHTML = renderCategorias(); break;
    case 'contas': main.innerHTML = renderContas(); break;
    case 'config': main.innerHTML = renderConfig(); break;
  }
  triggerPageFade(main);
  afterRender();
}

      <input type="text" name="nome_organizacao" required placeholder="Ex: Finanças da Vanessa">

      <button type="submit" class="btn" ${state.authLoading ? 'disabled' : ''}>${state.authLoading ? 'Aguarde...' : (isSignup ? 'Criar conta' : 'Entrar')}</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:.82rem;">
      ${isSignup ? 'Já tem conta?' : 'Ainda não tem conta?'}
      <button class="link-btn" id="btnToggleAuth">${isSignup ? 'Entrar' : 'Cadastre-se'}</button>
    </p>
  </div>`;
}
function afterRenderAuth(){
  document.getElementById('btnToggleAuth').addEventListener('click', ()=>{
    state.authMode = state.authMode === 'signup' ? 'login' : 'signup';
    state.authError = null;
    render();
  });
  document.getElementById('formAuth').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = fd.get('email').trim();
    const password = fd.get('password');
    state.authError = null;
    state.authLoading = true;
    render();

    if(state.authMode === 'signup'){
      const nomeOrg = fd.get('nome_organizacao').trim();
      const nomeCompleto = fd.get('nome_completo').trim();
      const rendaMensal = fd.get('renda_mensal') ? parseValor(fd.get('renda_mensal')) : null;
      const bancos = fd.getAll('bancos');
      const { data, error } = await sbClient.auth.signUp({
        email, password,
        options: { data: { nome_organizacao: nomeOrg, nome_completo: nomeCompleto, renda_mensal: rendaMensal, bancos } }
      });
      state.authLoading = false;
      if(error){
        state.authError = error.message;
        render();
        return;
      }
      if(!data.session){
        state.authError = null;
        state.authMode = 'login';
        render();
        showToast('Verifique seu e-mail para confirmar o cadastro.');
        return;
      }
      state.session = data.session;
      await iniciarAppLogado(true);
      return;
    }

    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    state.authLoading = false;
    if(error){
      state.authError = 'E-mail ou senha inválidos.';
      render();
      return;
    }
    state.session = data.session;
    await iniciarAppLogado(false);
  });
}

async function iniciarAppLogado(recemCadastrado){
  const ok = await carregarOrganizacao();
  if(!ok){
    showToast('Não foi possível carregar sua conta. Tente novamente em instantes.');
    render();
    return;
  }
  await loadAll();
  await seedCategoriasSeVazio();
  await garantirParcelasFuturas();
  if(recemCadastrado){
    state.onboardingSaldos = true;
  }
  render();
  if(!recemCadastrado) setTimeout(abrirSplashPendencias, 300);
}

/* ============================================================
   PENDÊNCIAS (compromissos a vencer)
============================================================ */
function renderPendencias(){
  const hoje = todayISO();
  const limite = addDaysISO(hoje, 7);

  const pendentes = state.parcelasCompromisso
    .filter(p=>p.status==='pendente')
    .map(p=>({...p, compromisso: state.compromissos.find(c=>c.id===p.compromisso_id)}))
    .filter(p=>p.compromisso)
    .sort((a,b)=> a.data_vencimento.localeCompare(b.data_vencimento));

  const atrasados = pendentes.filter(p=>p.data_vencimento < hoje);
  const hojeItens = pendentes.filter(p=>p.data_vencimento === hoje);
  const proximos = pendentes.filter(p=>p.data_vencimento > hoje && p.data_vencimento <= limite);

  if(atrasados.length + hojeItens.length + proximos.length === 0) return '';

  let html = `<div class="card compact">
    <h2 class="section-title">Pendências
      <small>${atrasados.length} atrasada(s) · ${hojeItens.length} vence(m) hoje · ${proximos.length} nos próx. 7 dias</small>
    </h2>`;
  for(const p of atrasados) html += pendenciaItemHTML(p, 'atrasado');
  for(const p of hojeItens) html += pendenciaItemHTML(p, 'hoje');
  for(const p of proximos) html += pendenciaItemHTML(p, 'proximo');
  html += `</div>`;
  return html;
}
function pendenciaItemHTML(p, situacao){
  const c = p.compromisso;
  const labelParcela = p.numero_parcela ? ` (${p.numero_parcela}/${p.total_parcelas})` : '';
  let situLabel;
  if(situacao === 'atrasado') situLabel = `Atrasado desde ${formatDataBR(p.data_vencimento)}`;
  else if(situacao === 'hoje') situLabel = 'Vence hoje';
  else situLabel = `Vence ${formatDataBR(p.data_vencimento)}`;
  const corClasse = situacao === 'proximo' ? '' : 'saida';
  return `<div class="lancamento-item" data-action="confirmar-parcela-compromisso" data-id="${p.id}">
    <div class="info">
      <div class="hist">${escHtml(c.descricao)}${labelParcela}</div>
      <div class="meta ${corClasse}">${situLabel} · ${escHtml(categoriaNome(c.categoria_id))}</div>
    </div>
    <div class="valor saida">${formatMoeda(p.valor_previsto)}</div>
  </div>`;
}
function abrirSplashPendencias(){
  const hoje = todayISO();
  const atrasados = state.parcelasCompromisso.filter(p=>p.status==='pendente' && p.data_vencimento < hoje);
  const hojeItens = state.parcelasCompromisso.filter(p=>p.status==='pendente' && p.data_vencimento === hoje);
  if(atrasados.length + hojeItens.length === 0) return;
  document.getElementById('splashRoot').innerHTML = `<div class="splash-overlay" id="splashOverlay">
    <div class="splash">
      <div class="splash-header"><h2>Fique de olho</h2><p>${atrasados.length} atrasada(s) e ${hojeItens.length} vencendo hoje</p></div>
      <div class="splash-body">
        ${atrasados.length ? '<div class="splash-section-label">Atrasadas</div>' + atrasados.map(p=>splashItemHTML(p,'atrasado')).join('') : ''}
        ${hojeItens.length ? '<div class="splash-section-label">Vencem hoje</div>' + hojeItens.map(p=>splashItemHTML(p,'hoje')).join('') : ''}
      </div>
      <div class="splash-footer"><button class="btn" id="btnFecharSplash">Entendi</button></div>
    </div>
  </div>`;
  document.getElementById('btnFecharSplash').addEventListener('click', ()=>{
    const overlay = document.getElementById('splashOverlay');
    overlay.classList.add('closing');
    setTimeout(()=>{ document.getElementById('splashRoot').innerHTML = ''; }, 180);
  });
}
function splashItemHTML(p, situacao){
  const c = state.compromissos.find(x=>x.id===p.compromisso_id);
  if(!c) return '';
  const labelParcela = p.numero_parcela ? ` (${p.numero_parcela}/${p.total_parcelas})` : '';
  return `<div class="splash-item ${situacao}">
    <div><div class="si-desc">${escHtml(c.descricao)}${labelParcela}</div><div class="si-meta">${formatDataBR(p.data_vencimento)}</div></div>
    <div class="si-valor">${formatMoeda(p.valor_previsto)}</div>
  </div>`;
}

   TELA: INÍCIO
============================================================ */
function renderInicio(){
  const total = saldoTotal();
  let html = `<div class="balances">
    <div class="balance-card total">
      <div class="label">Saldo total em contas</div>
      <div class="value ${total<0?'neg':''}">${formatMoeda(total)}</div>

    const v = saldoConta(conta.id);
    html += `<div class="balance-card">
      <div class="label">${escHtml(conta.nome)}</div>
      <div class="value ${v<0?'neg':''}">${formatMoeda(v)}</div>
    </div>`;
  }
  html += `</div></div>`;

  html += renderPendencias();

  const investido = valorTotalInvestido();
  const faturasAbertas = state.faturas.filter(f=>f.status!=='paga');
  html += `<div class="card compact">
    <h2 class="section-title">Resumo</h2>
    <div class="summary-row"><span>Investido atualmente</span><span>${formatMoeda(investido)}</span></div>
    <div class="summary-row"><span>Faturas de cartão em aberto</span><span>${formatMoeda(faturasAbertas.reduce((a,f)=>a+Number(f.valor_total),0))}</span></div>
  </div>`;

  html += `<div class="card compact">
    <h2 class="section-title">Receitas x Despesas (6 meses)</h2>
    <div class="chart-wrap"><canvas id="chartFluxo"></canvas></div>
  </div>`;

  const recentes = state.lancamentos.slice(0,8);
  html += `<div class="card">
    <h2 class="section-title">Lançamentos recentes</h2>`;
  if(recentes.length===0){
    html += `<div class="empty">Nenhum lançamento ainda.<br>Toque em "Lançar" para começar.</div>`;
  } else {
    for(const l of recentes){
      const isSaida = l.tipo === 'despesa';
      html += `<div class="lancamento-item">
        <div class="info">
          <div class="hist">${escHtml(l.descricao || categoriaNome(l.categoria_id))}</div>
          <div class="meta">${formatDataBR(l.data)} · ${escHtml(contaNome(l.conta_financeira_id))}</div>
        </div>
        <div class="valor ${isSaida?'saida':'entrada'}">${isSaida?'-':'+'} ${formatMoeda(l.valor)}</div>
      </div>`;
    }
  }
  html += `</div>`;
  return html;
}
function montarDadosFluxo6Meses(){
  const labels = [];
  const receitas = [];
  const despesas = [];
  for(let i=5;i>=0;i--){
    const ref = addMonthsISO(firstDayOfMonthISO(), -i);
    const [y,m] = ref.split('-');
    labels.push(nomeMesAno(ref).split(' de ')[0].slice(0,3));
    const doMes = state.lancamentos.filter(l=>l.data.slice(0,7) === `${y}-${m}`);
    receitas.push(round2(doMes.filter(l=>l.tipo==='receita').reduce((a,l)=>a+Number(l.valor),0)));
    despesas.push(round2(doMes.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+Number(l.valor),0)));
  }
  return {labels, receitas, despesas};
}
let chartFluxoInstance = null;
function renderizarChartFluxo(){
  const canvas = document.getElementById('chartFluxo');
  if(!canvas) return;
  const {labels, receitas, despesas} = montarDadosFluxo6Meses();
  if(chartFluxoInstance) chartFluxoInstance.destroy();
  chartFluxoInstance = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [
      {label:'Receitas', data:receitas, backgroundColor:'#2F7D5C'},
      {label:'Despesas', data:despesas, backgroundColor:'#A6432F'},
    ]},
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{size:10}}}}, scales:{y:{beginAtZero:true, ticks:{font:{size:9}}}, x:{ticks:{font:{size:9}}}} }
  });
}

function calcularMesFatura(cartao, dataCompraISO, offsetParcelas){
  const d = new Date(dataCompraISO+'T00:00:00');
  let mes = d.getMonth();
  let ano = d.getFullYear();
  if(d.getDate() > cartao.dia_fechamento) mes += 1;
  mes += offsetParcelas;
  const ref = new Date(ano, mes, 1);
  return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-01`;
}
async function garantirFatura(cartao, mesReferencia){
  let fatura = state.faturas.find(f=>f.cartao_id===cartao.id && f.mes_referencia===mesReferencia);
  if(fatura) return fatura;
  const [y,m] = mesReferencia.split('-').map(Number);
  const fechamento = new Date(y, m-1, cartao.dia_fechamento);
  let vencimento = new Date(y, m-1, cartao.dia_vencimento);
  if(cartao.dia_vencimento <= cartao.dia_fechamento) vencimento = new Date(y, m, cartao.dia_vencimento);
  fatura = await dbAdd('faturas_cartao', {
    cartao_id: cartao.id, mes_referencia: mesReferencia,
    data_fechamento: isoFromDate(fechamento), data_vencimento: isoFromDate(vencimento),
    valor_total: 0, status: 'aberta'
  });
  state.faturas.push(fatura);
  return fatura;
}

function abrirModalCompraCartao(cartaoId){
  const cartao = state.cartoes.find(c=>c.id===cartaoId);
  const categoriasDespesa = state.categorias.filter(c=>c.tipo==='despesa');
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" id="modalOverlay">
    <div class="modal">

      <form id="formCompraCartao">

        <label>Valor total</label>
        <input type="text" name="valor" inputmode="decimal" required placeholder="0,00">
        <label>Data da compra</label>
        <input type="date" name="data" value="${todayISO()}" required>
        <label>Parcelas</label>
        <input type="number" name="parcelas" min="1" value="1" required>
        <button type="submit" class="btn">Salvar compra</button>
      </form>
    </div>
  </div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') fecharModal(); });
  document.getElementById('formCompraCartao').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const valorTotal = parseValor(fd.get('valor'));
    const numParcelas = Number(fd.get('parcelas'));
    const dataCompra = fd.get('data');
    if(valorTotal<=0 || numParcelas<1){ showToast('Confira os valores.'); return; }

    const compra = await dbAdd('compras_cartao', {
      cartao_id: cartaoId, categoria_id: fd.get('categoria') || null,
      descricao: fd.get('descricao'), valor_total: valorTotal,
      parcelas_total: numParcelas, data_compra: dataCompra
    });

    const valorParcelaBase = round2(valorTotal/numParcelas);
    let somaAcumulada = 0;
    for(let i=1;i<=numParcelas;i++){
      const mesRef = calcularMesFatura(cartao, dataCompra, i-1);
      const fatura = await garantirFatura(cartao, mesRef);
      const valorParcela = i===numParcelas ? round2(valorTotal - somaAcumulada) : valorParcelaBase;
      somaAcumulada += valorParcela;
      await dbAdd('parcelas_cartao', {compra_id: compra.id, fatura_id: fatura.id, numero_parcela:i, valor_parcela: valorParcela, status:'pendente'});
      await dbPut('faturas_cartao', {id: fatura.id, valor_total: round2(Number(fatura.valor_total)+valorParcela)});
      fatura.valor_total = round2(Number(fatura.valor_total)+valorParcela);
    }
    await loadAll();
    fecharModal(); render(); showToast('Compra registrada.');
  });
}

async function garantirParcelasFuturas(){
  const hoje = todayISO();
  const limite = addMonthsISO(hoje, 3);
  for(const c of state.compromissos){
    if(!c.ativo || c.tipo !== 'recorrente') continue;
    const parcelasDoCompromisso = state.parcelasCompromisso.filter(p=>p.compromisso_id===c.id);
    let ultima = parcelasDoCompromisso.length ? parcelasDoCompromisso.reduce((a,b)=>a.data_vencimento>b.data_vencimento?a:b) : null;
    let proximaData = ultima ? addMonthsISO(ultima.data_vencimento, 1) : (c.data_inicio || hoje);
    while(proximaData <= limite){
      const nova = await dbAdd('compromissos_parcelas', {
        compromisso_id: c.id, data_vencimento: proximaData,
        valor_previsto: c.valor_previsto, status:'pendente'
      });
      state.parcelasCompromisso.push(nova);
      proximaData = addMonthsISO(proximaData, 1);
    }
  }
}

  let html = `<div class="card">
    <h2 class="section-title">Novo compromisso</h2>
    <div class="segmented">
      <button type="button" class="${state.compromissoTipo==='fixo'?'active':''}" data-ctipo="fixo">Fixo</button>
      <button type="button" class="${state.compromissoTipo==='parcelado'?'active':''}" data-ctipo="parcelado">Parcelado</button>
      <button type="button" class="${state.compromissoTipo==='recorrente'?'active':''}" data-ctipo="recorrente">Recorrente</button>
    </div>
    <form id="formCompromisso" class="compact-form">
      <label>Descrição</label>
      <input type="text" name="descricao" required>
      <label>Categoria</label>
      <select name="categoria">${state.categorias.filter(c=>c.tipo==='despesa').map(c=>`<option value="${c.id}">${escHtml(c.nome)}</option>`).join('')}</select>
      <label>Conta prevista para pagamento</label>
      <select name="conta">${state.contas.map(c=>`<option value="${c.id}">${escHtml(c.nome)}</option>`).join('')}</select>
      <label>Valor previsto</label>
      <input type="text" name="valor" inputmode="decimal" required placeholder="0,00">
      ${state.compromissoTipo==='parcelado' ? `
      <label>Data da 1ª parcela</label><input type="date" name="dataInicio" value="${todayISO()}" required>
      <label>Número de parcelas</label><input type="number" name="numParcelas" min="1" value="2" required>` : ''}
      ${state.compromissoTipo!=='parcelado' ? `
      <label>Dia de vencimento (todo mês)</label><input type="number" name="diaVencimento" min="1" max="28" required>
      <label>Data de início</label><input type="date" name="dataInicio" value="${todayISO()}" required>` : ''}
      <button type="submit" class="btn">Cadastrar compromisso</button>
    </form>
  </div>`;

  html += `<div class="card"><h2 class="section-title">Compromissos ativos</h2>`;
  const ativos = state.compromissos.filter(c=>c.ativo);
  if(ativos.length===0) html += `<div class="empty">Nenhum compromisso ativo.</div>`;
  for(const c of ativos){
    html += `<div class="list-row">
      <div><div class="name">${escHtml(c.descricao)}</div><div class="sub">${c.tipo} · ${formatMoeda(c.valor_previsto)} · ${escHtml(categoriaNome(c.categoria_id))}</div></div>
      <button class="icon-btn" data-action="inativar-compromisso" data-id="${c.id}">🗑</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}
function afterRenderCompromissos(){
  document.querySelectorAll('[data-ctipo]').forEach(b=>b.addEventListener('click', ()=>{ state.compromissoTipo=b.dataset.ctipo; render(); }));
  const form = document.getElementById('formCompromisso');
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const tipo = state.compromissoTipo;
    const valor = parseValor(fd.get('valor'));
    const compromisso = await dbAdd('compromissos', {
      descricao: fd.get('descricao'), tipo,
      categoria_id: fd.get('categoria') || null,
      conta_financeira_id: fd.get('conta') || null,
      valor_previsto: valor, valor_variavel: false,
      dia_vencimento: tipo!=='parcelado' ? Number(fd.get('diaVencimento')) : null,
      data_inicio: fd.get('dataInicio') || null,
      num_parcelas: tipo==='parcelado' ? Number(fd.get('numParcelas')) : null,
      ativo: true, observacoes: null
    });
    state.compromissos.push(compromisso);

    if(tipo === 'parcelado'){
      const n = Number(fd.get('numParcelas'));
      for(let i=1;i<=n;i++){
        const dv = addMonthsISO(fd.get('dataInicio'), i-1);
        const nova = await dbAdd('compromissos_parcelas', {compromisso_id: compromisso.id, numero_parcela:i, total_parcelas:n, data_vencimento:dv, valor_previsto: valor, status:'pendente'});
        state.parcelasCompromisso.push(nova);
      }
    } else if(tipo === 'fixo'){
      const dv = fd.get('dataInicio');
      const nova = await dbAdd('compromissos_parcelas', {compromisso_id: compromisso.id, data_vencimento: dv, valor_previsto: valor, status:'pendente'});
      state.parcelasCompromisso.push(nova);
    } else {
      await garantirParcelasFuturas();
    }
    render();
    showToast('Compromisso cadastrado.');
  });
  document.querySelectorAll('[data-action="inativar-compromisso"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Inativar este compromisso? Parcelas pendentes serão canceladas.')) return;
      const id = el.dataset.id;
      await dbPut('compromissos', {id, ativo:false});
      const pendentesDele = state.parcelasCompromisso.filter(p=>p.compromisso_id===id && p.status==='pendente');
      for(const p of pendentesDele) await dbPut('compromissos_parcelas', {id:p.id, status:'cancelado'});
      await loadAll();
      render();
      showToast('Compromisso inativado.');
    });
  });
  document.querySelectorAll('[data-action="confirmar-parcela-compromisso"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const p = state.parcelasCompromisso.find(x=>x.id===el.dataset.id);
      const c = state.compromissos.find(x=>x.id===p.compromisso_id);
      if(!confirm(`Confirmar pagamento de "${c.descricao}" no valor de ${formatMoeda(p.valor_previsto)}?`)) return;
      const lanc = await dbAdd('lancamentos', {
        conta_financeira_id: c.conta_financeira_id, categoria_id: c.categoria_id,
        tipo:'despesa', valor: p.valor_previsto, data: todayISO(), descricao: c.descricao
      });
      await dbPut('compromissos_parcelas', {id: p.id, status:'pago', lancamento_id: lanc.id, valor_pago: p.valor_previsto});
      await loadAll();
      const splashOv = document.getElementById('splashOverlay');
      if(splashOv){ splashOv.classList.add('closing'); setTimeout(()=>{ document.getElementById('splashRoot').innerHTML=''; }, 180); }
      else document.getElementById('splashRoot').innerHTML = '';
      render();
      showToast('Pagamento confirmado.');
    });
  });
}

/* ============================================================
   TELA: CATEGORIAS
============================================================ */
function renderCategorias(){
  let html = `<div class="card">
    <h2 class="section-title">Nova categoria</h2>
    <form id="formCategoria" class="compact-form">
      <label>Nome</label><input type="text" name="nome" required>

      <select name="tipo"><option value="receita">Receita</option><option value="despesa">Despesa</option></select>
      <button type="submit" class="btn">Adicionar</button>
    </form>
  </div><div class="card">`;
  if(state.categorias.length===0) html += `<div class="empty">Nenhuma categoria.</div>`;
  for(const c of state.categorias){
    html += `<div class="category-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);">
      <span class="name">${escHtml(c.nome)}</span>
      <span class="tag ${c.tipo}">${c.tipo}</span>
      <button class="icon-btn" data-action="excluir-categoria" data-id="${c.id}">🗑</button>

}
function afterRenderCategorias(){
  document.getElementById('formCategoria').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    await dbAdd('categorias', {nome: fd.get('nome'), tipo: fd.get('tipo')});
    state.categorias = await dbGetAll('categorias', {col:'nome'});
    render(); showToast('Categoria adicionada.');
  });
  document.querySelectorAll('[data-action="excluir-categoria"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Excluir esta categoria?')) return;
      await dbDelete('categorias', el.dataset.id);
      state.categorias = await dbGetAll('categorias', {col:'nome'});
      render(); showToast('Categoria excluída.');
    });
  });
}

/* ============================================================
   TELA: RELATÓRIOS
============================================================ */
let chartCategoriasInstance = null;
function renderRelatorios(){
  const f = state.reportFilters || {de: firstDayOfMonthISO(), ate: todayISO(), conta:'', tipo:''};
  let html = `<div class="card compact">
    <h2 class="section-title">Filtros</h2>
    <form id="formRelatorio" class="compact-form">
      <div class="filters-grid">
        <div><label>De</label><input type="date" name="de" value="${f.de}"></div>
        <div><label>Até</label><input type="date" name="ate" value="${f.ate}"></div>
      </div>
      <label>Conta</label>
      <select name="conta"><option value="">Todas</option>${state.contas.map(c=>`<option value="${c.id}" ${f.conta===c.id?'selected':''}>${escHtml(c.nome)}</option>`).join('')}</select>
      <button type="submit" class="btn">Gerar relatório</button>
    </form>
  </div>`;

  if(state.reportResult){
    const r = state.reportResult;
    html += `<div class="card compact">
      <h2 class="section-title">Despesas por categoria</h2>
      <div class="chart-wrap"><canvas id="chartCategorias"></canvas></div>
    </div>`;
    html += `<div class="card">
      <h2 class="section-title">Resultado</h2>
      <div class="table-wrap"><table class="report">
        <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th class="num">Valor</th></tr></thead>
        <tbody>${r.lancamentos.map(l=>`<tr><td>${formatDataBR(l.data)}</td><td>${escHtml(l.descricao||'')}</td><td>${escHtml(categoriaNome(l.categoria_id))}</td><td>${escHtml(contaNome(l.conta_financeira_id))}</td><td class="num" style="color:${l.tipo==='despesa'?'var(--saida)':'var(--entrada)'}">${l.tipo==='despesa'?'-':'+'} ${formatMoeda(l.valor)}</td></tr>`).join('')}</tbody>
        <tfoot>
          <tr class="total-row"><td colspan="4">Receitas</td><td class="num">${formatMoeda(r.totalReceitas)}</td></tr>
          <tr class="total-row"><td colspan="4">Despesas</td><td class="num">${formatMoeda(r.totalDespesas)}</td></tr>
          <tr class="saldo-row"><td colspan="4">Saldo do período</td><td class="num">${formatMoeda(r.totalReceitas-r.totalDespesas)}</td></tr>
        </tfoot>
      </table></div>
      <div class="btn-row">
        <button class="btn secondary small" id="btnExportarCSV">Exportar CSV</button>
        <button class="btn secondary small" id="btnExportarPDF">Exportar PDF</button>
      </div>
    </div>`;
  }
  return html;
}
function afterRenderRelatorios(){
  document.getElementById('formRelatorio').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const filtros = {de: fd.get('de'), ate: fd.get('ate'), conta: fd.get('conta')};
    state.reportFilters = filtros;
    const lancamentosFiltrados = state.lancamentos.filter(l=>{
      if(l.data < filtros.de || l.data > filtros.ate) return false;
      if(filtros.conta && l.conta_financeira_id !== filtros.conta) return false;
      return true;
    }).sort((a,b)=>a.data.localeCompare(b.data));
    const totalReceitas = round2(lancamentosFiltrados.filter(l=>l.tipo==='receita').reduce((a,l)=>a+Number(l.valor),0));
    const totalDespesas = round2(lancamentosFiltrados.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+Number(l.valor),0));
    state.reportResult = {lancamentos: lancamentosFiltrados, totalReceitas, totalDespesas};
    render();
  });
  const btnCsv = document.getElementById('btnExportarCSV');
  if(btnCsv) btnCsv.addEventListener('click', ()=>{
    const r = state.reportResult;
    const rows = [['Data','Descrição','Categoria','Conta','Tipo','Valor']];
    for(const l of r.lancamentos) rows.push([formatDataBR(l.data), l.descricao||'', categoriaNome(l.categoria_id), contaNome(l.conta_financeira_id), l.tipo, String(l.valor).replace('.',',')]);
    downloadFile(toCSV(rows), `relatorio_${todayISO()}.csv`, 'text/csv;charset=utf-8;');
  });
  const btnPdf = document.getElementById('btnExportarPDF');
  if(btnPdf) btnPdf.addEventListener('click', ()=>{
    const r = state.reportResult;
    const doc = new jspdf.jsPDF();
    doc.setFontSize(14); doc.text(state.orgNome || 'Relatório Financeiro', 14, 16);
    doc.setFontSize(10); doc.text(`Período: ${formatDataBR(state.reportFilters.de)} a ${formatDataBR(state.reportFilters.ate)}`, 14, 23);
    doc.autoTable({
      startY: 28,
      head: [['Data','Descrição','Categoria','Conta','Valor']],
      body: r.lancamentos.map(l=>[formatDataBR(l.data), l.descricao||'', categoriaNome(l.categoria_id), contaNome(l.conta_financeira_id), (l.tipo==='despesa'?'-':'+')+' '+formatMoeda(l.valor)]),
      styles:{fontSize:8}
    });
    doc.save(`relatorio_${todayISO()}.pdf`);
  });
  renderizarChartCategorias();
}
function renderizarChartCategorias(){
  const canvas = document.getElementById('chartCategorias');
  if(!canvas || !state.reportResult) return;
  const porCategoria = {};
  for(const l of state.reportResult.lancamentos){
    if(l.tipo!=='despesa') continue;
    const nome = categoriaNome(l.categoria_id);
    porCategoria[nome] = (porCategoria[nome]||0) + Number(l.valor);
  }
  const labels = Object.keys(porCategoria);
  const valores = Object.values(porCategoria);
  if(chartCategoriasInstance) chartCategoriasInstance.destroy();
  if(labels.length===0) return;
  chartCategoriasInstance = new Chart(canvas, {
    type:'doughnut',
    data:{labels, datasets:[{data:valores, backgroundColor:['#A6432F','#C28E2C','#1F4734','#3A6B53','#7A746A','#D98E6B','#4C7A8F','#8C5E9E']}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{font:{size:9}}}}}
  });
}

/* ============================================================
   TELA: CONFIGURAÇÕES
============================================================ */
function renderConfig(){
  let camposSaldos = '';
  for(const c of state.contas){
    camposSaldos += `<label>${escHtml(c.nome)}</label><input type="text" name="saldo_${c.id}" inputmode="decimal" value="${(Number(c.saldo_inicial)||0).toFixed(2).replace('.',',')}">`;
  }
  return `<div class="card">
    <h2 class="section-title">Organização</h2>
    <form id="formOrg" class="compact-form">
      <label>Nome</label><input type="text" name="nome" value="${escHtml(state.orgNome)}">
      <label>Renda mensal (opcional)</label><input type="text" name="rendaMensal" inputmode="decimal" value="${state.rendaMensal?String(state.rendaMensal).replace('.',','):''}">
      <button type="submit" class="btn small">Salvar</button>
    </form>
  </div>
  <div class="card">
    <h2 class="section-title">Saldos iniciais<small>Data-base: a partir daqui o controle passa a contar</small></h2>
    <form id="formSaldos">
      <label>Data base</label>
      <input type="date" name="dataBase" value="${state.saldosDataBase || todayISO()}">
      ${camposSaldos}
      <button type="submit" class="btn">Salvar saldos</button>
    </form>
  </div>
  <div class="card">
    <h2 class="section-title">Backup</h2>
    <button class="btn secondary" id="btnBackup">Exportar backup (JSON)</button>
    <label style="margin-top:14px;">Restaurar backup</label>
    <input type="file" id="inputRestaurar" accept="application/json">
    <p class="note">Restaurar substitui todos os lançamentos, categorias e compromissos atuais desta conta.</p>
  </div>
  <div class="card">
    <button class="btn ghost" id="btnSair">Sair da conta</button>
  </div>`;
}
function afterRenderConfig(){
  document.getElementById('formOrg').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const nome = fd.get('nome');
    const rendaMensal = fd.get('rendaMensal') ? parseValor(fd.get('rendaMensal')) : null;
    await dbPut('organizacoes', {id: state.orgId, nome, renda_mensal: rendaMensal});
    state.orgNome = nome;
    state.rendaMensal = rendaMensal;
    render(); showToast('Dados atualizados.');
  });
  document.getElementById('formSaldos').addEventListener('submit', async (e)=>{
    e.preventDefault();
    await salvarSaldosIniciais(new FormData(e.target));
    render(); showToast('Saldos atualizados.');
  });
  document.getElementById('btnBackup').addEventListener('click', ()=>{
    const backup = {
      versao:1, exportadoEm: new Date().toISOString(), organizacao: state.orgNome,
      contas: state.contas, categorias: state.categorias, lancamentos: state.lancamentos,
      cartoes: state.cartoes, faturas: state.faturas, compras: state.compras, parcelasCartao: state.parcelasCartao,
      investimentos: state.investimentos, aportes: state.aportes,
      compromissos: state.compromissos, parcelasCompromisso: state.parcelasCompromisso,
    };
    downloadFile(JSON.stringify(backup,null,2), `backup_financeiro_${todayISO()}.json`, 'application/json');
    showToast('Backup exportado.');
  });
  document.getElementById('inputRestaurar').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    showToast('Restauração de backup é feita manualmente pelo suporte por enquanto.');
    e.target.value = '';
  });
  document.getElementById('btnSair').addEventListener('click', async ()=>{
    if(!confirm('Sair da sua conta?')) return;
    await sbClient.auth.signOut();
    state = {...state, session:null, orgId:null, orgNome:'', contas:[], categorias:[], lancamentos:[], cartoes:[], faturas:[], compras:[], parcelasCartao:[], investimentos:[], aportes:[], compromissos:[], parcelasCompromisso:[], tab:'inicio'};
    render();
  });
}

/* ============================================================
   PÓS-RENDER (liga os eventos de cada tela)
============================================================ */
function afterRender(){
  switch(state.tab){
    case 'inicio': renderizarChartFluxo(); break;
    case 'lancar': afterRenderLancar(); break;
    case 'cartoes': afterRenderCartoes(); break;
    case 'relatorios': afterRenderRelatorios(); break;
    case 'mais': afterRenderMais(); break;
    case 'investimentos': afterRenderInvestimentos(); break;
    case 'compromissos': afterRenderCompromissos(); break;
    case 'categorias': afterRenderCategorias(); break;
    case 'contas': afterRenderContas(); break;
    case 'config': afterRenderConfig(); break;
  }
}
document.querySelectorAll('nav.bottomnav button').forEach(b=>{
  b.addEventListener('click', ()=>setTab(b.dataset.tab));
});

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
(async function init(){
  const { data } = await sbClient.auth.getSession();
  state.session = data.session;

  sbClient.auth.onAuthStateChange((event, session)=>{
    if(!session && state.session){
      state.session = null;
      state.tab = 'inicio';
      render();
    }
  });

  if(state.session){
    await iniciarAppLogado(false);
  } else {
    render();
  }
})();
</script>
