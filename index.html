<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Financeiro">
<meta name="theme-color" content="#12142E">
<title>Meu Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4FA;
  --card:#FFFFFF;
  --ink:#12142E;
  --ink-2:#5A6180;
  --ink-3:#9AA0BE;
  --line:#E8EAF3;
  --accent:#10B981;
  --accent-ink:#0B9E6F;
  --accent-2:#3B82F6;
  --entrada:#10B981;
  --saida:#F04438;
  --gold:#D98E1E;
  --grad:linear-gradient(120deg,#10B981 0%,#3B82F6 100%);
  --shadow:0 10px 34px rgba(18,20,46,.08);
  --shadow-sm:0 4px 16px rgba(18,20,46,.06);
  --r-lg:26px;
  --r-md:18px;
  --r-sm:14px;
  --ease:cubic-bezier(.22,.68,0,1);
}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes sheetOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(28px);}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes enterUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ====== Transição em cascata entre páginas ====== */
#main{transition:opacity .18s ease, transform .18s ease;}
#main.page-exit{opacity:0;transform:translateY(10px);}
#main.page-enter>*{opacity:0;animation:enterUp .5s var(--ease) forwards;}
#main.page-enter>*:nth-child(1){animation-delay:.02s}
#main.page-enter>*:nth-child(2){animation-delay:.08s}
#main.page-enter>*:nth-child(3){animation-delay:.14s}
#main.page-enter>*:nth-child(4){animation-delay:.20s}
#main.page-enter>*:nth-child(5){animation-delay:.26s}
#main.page-enter>*:nth-child(6){animation-delay:.32s}
#main.page-enter>*:nth-child(n+7){animation-delay:.38s}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
html,body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;}
body{-webkit-tap-highlight-color:transparent;}
::selection{background:rgba(16,185,129,.2);}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

/* ---------- Header ---------- */
header.topbar{background:transparent;padding:26px 22px 6px;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(242,244,250,.82);}
header.topbar h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.5rem;letter-spacing:-.02em;color:var(--ink);}
header.topbar .sub{font-size:.74rem;color:var(--ink-2);margin-top:3px;font-weight:500;}

/* ---------- HERO: saldo total ---------- */
.hero{margin:14px 20px 4px;background:linear-gradient(140deg,#171B42 0%,#232A6B 55%,#1B3B6E 100%);border-radius:var(--r-lg);padding:26px 24px 22px;color:#fff;box-shadow:0 18px 44px rgba(23,27,66,.35);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.35),transparent 70%);top:-90px;right:-60px;}
.hero::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.28),transparent 70%);bottom:-70px;left:-40px;}
.hero .h-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);}
.hero .h-value{font-family:'Fraunces',Georgia,serif;font-size:2.7rem;font-weight:600;letter-spacing:-.03em;line-height:1.08;margin-top:8px;position:relative;z-index:1;}
.hero .h-value.neg{color:#FF8A80;}
.hero .h-sub{font-size:.76rem;color:rgba(255,255,255,.62);margin-top:6px;position:relative;z-index:1;}

/* ---------- Chips de contas: cartões de vidro ---------- */
.acct-row{display:flex;gap:10px;overflow-x:auto;padding:16px 20px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.acct-row::-webkit-scrollbar{display:none;}
.acct-card{flex:none;min-width:150px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.7);scroll-snap-align:start;}
.acct-card .a-top{display:flex;align-items:center;gap:7px;}
.acct-card .a-ico{width:26px;height:26px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:rgba(16,185,129,.12);color:var(--accent-ink);flex:none;}
.acct-card .a-ico svg{width:14px;height:14px;}
.acct-card .a-name{font-size:.72rem;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px;}
.acct-card .a-val{font-family:'Fraunces',Georgia,serif;font-size:1.06rem;font-weight:600;margin-top:8px;letter-spacing:-.01em;}
.acct-card .a-val.neg{color:var(--saida);}

main{flex:1;padding:14px 20px 130px;}

/* ---------- Bottom nav ---------- */
nav.bottomnav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:26px;display:flex;z-index:20;padding:8px;box-shadow:0 14px 40px rgba(18,20,46,.14);}
nav.bottomnav button{flex:1;background:none;border:none;padding:9px 2px;font-size:.6rem;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;font-weight:600;cursor:pointer;border-radius:18px;transition:all .25s var(--ease);line-height:1.1;text-align:center;}
nav.bottomnav button.active{color:var(--accent-ink);font-weight:800;background:rgba(16,185,129,.10);}
nav.bottomnav svg{width:21px;height:21px;}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.card.compact{padding:20px;}
h2.section-title{font-size:.98rem;font-weight:800;margin-bottom:16px;color:var(--ink);letter-spacing:-.01em;}
h2.section-title small{display:block;font-size:.72rem;color:var(--ink-3);text-transform:none;letter-spacing:.01em;font-weight:500;margin-top:3px;}

/* ---------- Formulários: modernos, sem cara de planilha ---------- */
label{display:block;font-size:.73rem;color:var(--ink-2);margin:16px 0 7px;font-weight:600;}
.compact-form label{margin:12px 0 6px;font-size:.7rem;}
input,select,textarea{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:.95rem;background:#FBFCFE;font-family:inherit;color:var(--ink);transition:border-color .18s, box-shadow .18s, background .18s;}
input:hover,select:hover{border-color:#D6DBEA;}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(16,185,129,.14);}

/* ---------- Segmentado: pílula moderna ---------- */
.segmented{display:flex;background:#E9ECF5;border-radius:16px;padding:4px;gap:2px;margin-top:10px;}
.segmented button{flex:1;padding:10px 4px;border:none;background:transparent;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--ink-2);cursor:pointer;border-radius:12px;transition:all .22s var(--ease);}
.segmented button.active{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 3px 10px rgba(18,20,46,.10);}

/* ---------- Botões ---------- */
.btn{display:block;width:100%;background:var(--grad);color:#fff;border:none;border-radius:999px;font-size:.94rem;font-weight:700;font-family:inherit;margin-top:20px;cursor:pointer;text-align:center;padding:14px 22px;box-shadow:0 8px 22px rgba(16,185,129,.28);transition:transform .18s var(--ease), box-shadow .18s, opacity .15s;}
.btn:hover{opacity:.94;box-shadow:0 10px 26px rgba(16,185,129,.36);}
.btn:active{transform:scale(.97);}
.btn.secondary{color:var(--accent-ink);background:rgba(16,185,129,.10);box-shadow:none;}
.btn.secondary:hover{background:rgba(16,185,129,.16);}
.btn.danger{color:#fff;background:linear-gradient(120deg,#F04438,#D92D20);box-shadow:0 8px 22px rgba(240,68,56,.24);}
.btn.ghost{color:var(--ink-2);background:transparent;box-shadow:none;border:1.5px solid var(--line);}
.btn.small{padding:11px 20px;font-size:.86rem;margin-top:0;width:auto;display:inline-block;}
.btn-row{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap;}
.btn-row .btn{margin-top:0;flex:none;}
.link-btn{background:none;border:none;color:var(--accent-ink);font-weight:700;font-size:.84rem;cursor:pointer;text-decoration:none;font-family:inherit;padding:0;}
.link-btn:hover{text-decoration:underline;text-underline-offset:3px;}

/* ---------- Chips de bancos ---------- */
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.chip{position:relative;display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#FBFCFE;font-size:.82rem;font-weight:600;color:var(--ink-2);cursor:pointer;transition:all .18s var(--ease);}
.chip input{position:absolute;opacity:0;pointer-events:none;}
.chip:has(input:checked){background:rgba(16,185,129,.1);border-color:var(--accent);color:var(--accent-ink);font-weight:700;}

/* ---------- Listas ---------- */
.lancamento-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:14px;cursor:pointer;transition:background .15s;}
.lancamento-item:last-child{border-bottom:none;}
.lancamento-item .info{flex:1;min-width:0;}
.lancamento-item .hist{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em;}
.lancamento-item .meta{font-size:.74rem;color:var(--ink-3);margin-top:3px;font-weight:500;}
.lancamento-item .meta.saida{color:var(--saida);font-weight:600;}
.lancamento-item .valor{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:.98rem;white-space:nowrap;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dot.entrada{background:var(--entrada);box-shadow:0 0 0 4px rgba(16,185,129,.14);}
.dot.saida{background:var(--saida);box-shadow:0 0 0 4px rgba(240,68,56,.12);}
.valor.entrada{color:var(--entrada);}
.valor.saida{color:var(--saida);}

.empty{text-align:center;color:var(--ink-3);padding:40px 12px;font-size:.88rem;line-height:1.6;font-weight:500;}

/* ---------- Cards de destaque (investimentos / faturas) ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-tile{border-radius:var(--r-md);padding:18px 16px;position:relative;overflow:hidden;}
.stat-tile.inv{background:linear-gradient(140deg,rgba(16,185,129,.10),rgba(59,130,246,.08));border:1px solid rgba(16,185,129,.22);}
.stat-tile.fat{background:linear-gradient(140deg,rgba(217,142,30,.10),rgba(240,68,56,.06));border:1px solid rgba(217,142,30,.22);}
.stat-tile .st-label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);}
.stat-tile .st-value{font-family:'Fraunces',Georgia,serif;font-size:1.28rem;font-weight:600;margin-top:6px;letter-spacing:-.01em;}
.stat-tile .st-sub{font-size:.72rem;color:var(--ink-2);margin-top:4px;font-weight:500;}
.fatura-mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(18,20,46,.1);}
.fatura-mini:last-child{border-bottom:none;}
.fatura-mini .fm-n{font-size:.78rem;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fatura-mini .fm-d{font-size:.68rem;color:var(--ink-3);}
.fatura-mini .fm-v{font-family:'Fraunces',serif;font-size:.84rem;font-weight:600;white-space:nowrap;}
/* ---------- Navegação de fatura por mês ---------- */
.mes-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.mes-nav button{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1.3rem;line-height:1;color:var(--ink-2);cursor:pointer;font-family:inherit;transition:transform .18s var(--ease),background .15s;}
.mes-nav button:active{transform:scale(.92);}
.mes-nav .mn-t{flex:1;text-align:center;min-width:0;}
.mes-nav .mn-t .m{font-family:'Fraunces',Georgia,serif;font-size:1.08rem;font-weight:600;letter-spacing:-.01em;}
.mes-nav .mn-t .s{font-size:.72rem;color:var(--ink-3);margin-top:5px;font-weight:500;}
.fat-resumo{text-align:center;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px;}
.fat-resumo .fr-total{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;font-weight:600;letter-spacing:-.02em;}
.fat-resumo .fr-sub{font-size:.76rem;color:var(--ink-2);margin-top:4px;font-weight:500;}
.hint-txt{font-size:.78rem;color:var(--ink-2);margin-top:10px;line-height:1.5;}
.alert-txt{font-size:.8rem;color:var(--saida);font-weight:600;margin-top:12px;line-height:1.5;}
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.cat-row:last-child{border-bottom:none;}
.cat-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.cat-n{flex:1;min-width:0;font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-n small{display:block;font-size:.7rem;color:var(--ink-3);font-weight:500;margin-top:2px;}
.cat-v{text-align:right;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:.94rem;white-space:nowrap;}
.cat-v small{display:block;font-family:'Inter',sans-serif;font-size:.68rem;font-weight:700;margin-top:2px;}
.cat-v small.up{color:var(--saida);} .cat-v small.down{color:var(--accent-ink);} .cat-v small.eq{color:var(--ink-3);}
.cat-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem;font-weight:700;}
.cat-total small{font-size:.72rem;font-weight:700;}
.cat-total small.up{color:var(--saida);} .cat-total small.down{color:var(--accent-ink);}
.prev-row{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.84rem;align-items:center;}
.prev-row:last-of-type{border-bottom:none;}
.prev-row.head{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding-top:0;}
.prev-row .r{text-align:right;font-weight:600;}
.prev-row .r.neg{color:var(--saida);}
.orc-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.orc-item:last-child{border-bottom:none;}
.orc-top{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-weight:600;}
.orc-top span:last-child{font-family:'Fraunces',Georgia,serif;font-size:.86rem;white-space:nowrap;}
.orc-bar{height:8px;border-radius:99px;background:rgba(18,20,46,.07);overflow:hidden;margin-top:8px;}
.orc-bar>span{display:block;height:100%;border-radius:99px;background:var(--accent);}
.orc-bar.warn>span{background:var(--gold);} .orc-bar.over>span{background:var(--saida);}
.orc-sub{font-size:.72rem;margin-top:6px;font-weight:600;color:var(--ink-3);}
.orc-sub.over{color:var(--saida);} .orc-sub.warn{color:var(--gold);}

/* ---------- Banner de ação ---------- */
.action-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#FFF7E8,#FFF);border:1px solid rgba(217,142,30,.3);border-radius:var(--r-md);padding:16px;margin-bottom:16px;cursor:pointer;transition:transform .18s var(--ease);}
.action-banner:active{transform:scale(.98);}
.action-banner .ab-ico{width:40px;height:40px;border-radius:13px;background:rgba(217,142,30,.14);display:inline-flex;align-items:center;justify-content:center;color:var(--gold);flex:none;}
.action-banner .ab-t{font-size:.88rem;font-weight:700;}
.action-banner .ab-d{font-size:.74rem;color:var(--ink-2);margin-top:2px;}

/* ---------- Modais / Splash ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(18,20,46,.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:overlayIn .22s var(--ease);}
.modal-overlay.closing{animation:overlayOut .18s var(--ease) forwards;}
.modal{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:26px 24px 36px;max-height:88vh;overflow-y:auto;box-shadow:0 -18px 60px rgba(18,20,46,.25);animation:sheetIn .3s var(--ease);}
.modal-overlay.closing .modal{animation:sheetOut .2s var(--ease) forwards;}
.modal h3{font-weight:800;color:var(--ink);margin-bottom:6px;font-size:1.06rem;letter-spacing:-.01em;}
.modal .note{font-size:.8rem;color:var(--ink-2);margin-top:12px;line-height:1.55;}

.splash-overlay{position:fixed;inset:0;background:rgba(18,20,46,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px;animation:overlayIn .25s var(--ease);}
.splash-overlay.closing{animation:overlayOut .18s var(--ease) forwards;}
.splash{background:var(--card);width:100%;max-width:460px;border-radius:26px;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:popIn .34s var(--ease);}
.splash-header{background:linear-gradient(140deg,#171B42,#232A6B);color:#fff;padding:24px 22px 20px;}
.splash-header h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.35rem;margin-bottom:3px;letter-spacing:-.02em;}
.splash-header p{font-size:.8rem;color:rgba(255,255,255,.7);}
.splash-body{flex:1;overflow-y:auto;padding:16px 18px;}
.splash-footer{padding:14px 18px 18px;border-top:1px solid var(--line);}
.splash-footer .btn{margin-top:0;}
.splash-section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-3);margin:14px 0 6px;}
.splash-item{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-radius:14px;margin-bottom:4px;gap:10px;transition:background .15s;}
.splash-item.atrasado{background:rgba(240,68,56,.06);}
.splash-item.hoje{background:rgba(217,142,30,.08);}
.splash-item .si-desc{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.splash-item .si-meta{font-size:.72rem;color:var(--ink-3);margin-top:2px;}
.splash-item .si-valor{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:.95rem;white-space:nowrap;color:var(--saida);}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:.85rem;font-weight:600;z-index:60;opacity:0;transition:all .3s var(--ease);pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Tabelas ---------- */
table.report{width:100%;border-collapse:collapse;font-size:.85rem;}
table.report th,table.report td{padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;}
table.report th{font-size:.66rem;text-transform:uppercase;color:var(--ink-3);letter-spacing:.08em;font-weight:700;}
table.report td.num,table.report th.num{text-align:right;font-family:'Fraunces',Georgia,serif;}
table.report tr.total-row td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:none;}
table.report tr.saldo-row td{font-weight:700;color:var(--accent-ink);}
.table-wrap{overflow-x:auto;}
.filters-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

/* ---------- Linhas de lista ---------- */
.list-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);gap:10px;cursor:pointer;transition:opacity .15s;}
.list-row:hover{opacity:.72;}
.list-row:last-child{border-bottom:none;}
.list-row .name{flex:1;font-size:.94rem;font-weight:600;letter-spacing:-.01em;}
.list-row .sub{font-size:.74rem;color:var(--ink-3);margin-top:3px;font-weight:500;}

/* ---------- Tags ---------- */
.tag{font-size:.62rem;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap;}

/* ============ UTILITÁRIOS ============ */
function lsGet(k){ try{ return localStorage.getItem('mf_'+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem('mf_'+k, v); }catch(e){} }
function normTxt(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function isoFromDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function firstDayOfMonthISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function nomeMesAno(iso){
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [y,m] = iso.split('-');
  return `${meses[parseInt(m,10)-1]} de ${y}`;
}
function nomeMesCurto(iso){
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return meses[parseInt(iso.split('-')[1],10)-1];
}
function addDaysISO(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return isoFromDate(d);
}
function addMonthsISO(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const ref = new Date(y, (m-1)+n, 1);
  const lastDay = new Date(ref.getFullYear(), ref.getMonth()+1, 0).getDate();
  const day = Math.min(d, lastDay);
  return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function formatMoeda(v){
  return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function formatDataBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function parseValor(str){
  str = String(str||'').trim();
  if(str === '') return 0;
  if(str.includes(',')){
    str = str.replace(/\./g,'').replace(',', '.');
  }
  const v = parseFloat(str);
  return isNaN(v) ? 0 : v;
}
function round2(v){ return Math.round(v*100)/100; }
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function toCSV(rows){
  const BOM = '\uFEFF';
  return BOM + rows.map(r=>r.map(c=>{
    c = (c===null||c===undefined)?'':String(c);
    if(c.includes(';')||c.includes('"')||c.includes('\n')){
      c = '"'+c.replace(/"/g,'""')+'"';
    }
    return c;
  }).join(';')).join('\r\n');
}

/* ============ SUPABASE ============ */
const TABLES_COM_ORG = new Set(['lancamentos','categorias','contas_financeiras','cartoes_credito','investimentos','compromissos']);

async function dbGetAll(table, order){
  let q = sbClient.from(table).select('*');
  if(order) q = q.order(order.col, {ascending: order.asc !== false});
  const { data, error } = await q;
  if(error){
    console.error(table, error);
    showToast('Erro ao carregar dados.');
    return [];
  }
  return data || [];
}
async function dbAdd(table, obj){
  const payload = TABLES_COM_ORG.has(table) ? {...obj, organizacao_id: state.orgId} : obj;
  const { data, error } = await sbClient.from(table).insert(payload).select().single();
  if(error){
    console.error(table, error);
    showToast('Erro ao salvar.');
    throw error;
  }
  return data;
}
async function dbPut(table, obj){
  const { id, ...fields } = obj;
  if(!id){
    showToast('Erro: registro sem identificador.');
    throw new Error('dbPut sem id');
  }
  const { data, error } = await sbClient.from(table).update(fields).eq('id', id).select().single();
  if(error){
    console.error(table, error);
    showToast('Erro ao atualizar.');
    throw error;
  }
  return data;
}
async function dbDelete(table, id){
  const { error } = await sbClient.from(table).delete().eq('id', id);
  if(error){
    console.error(table, error);
    showToast('Erro ao excluir.');
    throw error;
  }
}

/* ============ SALDOS ============ */
function saldoConta(contaId){
  const conta = state.contas.find(c=>c.id===contaId);
  if(!conta) return 0;
  let saldo = Number(conta.saldo_inicial)||0;
  for(const l of state.lancamentos){
    if(l.conta_financeira_id !== contaId) continue;
    if(l.data < state.saldosDataBase) continue;
    saldo += (l.tipo === 'receita' ? Number(l.valor) : -Number(l.valor));
  }
  return saldo;
}
function saldoTotal(){
  return state.contas.reduce((acc,c)=>acc + saldoConta(c.id), 0);
}
/* Detecta usuário que nunca definiu saldo: conta zerada + sem lançamentos */
function verificarNecessidadeSaldos(){
  const temContaSemSaldo = state.contas.length > 0 && state.contas.every(c => !Number(c.saldo_inicial));
  state.precisaDefinirSaldos = temContaSemSaldo && state.lancamentos.length === 0 && !state.saldosDataBase;
}
function totaisInvestimentos(){
  let aportado = 0, atual = 0;
  for(const inv of state.investimentos){
    const aportesInv = state.aportes.filter(a=>a.investimento_id===inv.id);
    if(aportesInv.length===0) continue;
    const ultimo = aportesInv.sort((a,b)=>a.data.localeCompare(b.data))[aportesInv.length-1];
    aportado += aportesInv.reduce((a,x)=>a+Number(x.valor_aportado),0);
    atual += Number(ultimo.valor_atual != null ? ultimo.valor_atual : ultimo.valor_aportado);
  }
  return { aportado: round2(aportado), atual: round2(atual), ganho: round2(atual - aportado) };
}

/* ============ ROTEAMENTO com transição em cascata ============ */
const TABS_MAIS = ['extrato','investimentos','compromissos','categorias','contas','config'];
let navegando = false;

function setTab(tab){
  if(tab === state.tab) return;
  const main = document.getElementById('main');
  main.classList.add('page-exit');
  navegando = true;
  setTimeout(()=>{
    state.tab = tab;
    render();
    main.classList.remove('page-exit');
    main.classList.add('page-enter');
    setTimeout(()=>{ main.classList.remove('page-enter'); navegando = false; }, 600);
    window.scrollTo({top:0, behavior:'smooth'});
  }, 170);
}

function render(){
  const nav = document.querySelector('nav.bottomnav');

  if(!state.session){
    nav.style.display = 'none';
    document.getElementById('pageTitle').textContent = 'Meu Financeiro';
    document.getElementById('pageSub').textContent = 'Cadastre-se ou entre na sua conta';
    const mainAuth = document.getElementById('main');
    mainAuth.innerHTML = renderAuth();
    if(!navegando){ mainAuth.classList.add('page-enter'); setTimeout(()=>mainAuth.classList.remove('page-enter'),600); }
    afterRenderAuth();
    return;
  }

  if(state.onboardingSaldos){
    nav.style.display = 'none';
    document.getElementById('pageTitle').textContent = 'Saldos iniciais';
    document.getElementById('pageSub').textContent = 'De onde seu controle começa a contar';
    const mainOnb = document.getElementById('main');
    mainOnb.innerHTML = renderOnboardingSaldos();
    if(!navegando){ mainOnb.classList.add('page-enter'); setTimeout(()=>mainOnb.classList.remove('page-enter'),600); }
    afterRenderOnboardingSaldos();
    return;
  }

  nav.style.display = '';
  document.querySelectorAll('nav.bottomnav button').forEach(b=>{
    const isMais = b.dataset.tab === 'mais' && TABS_MAIS.includes(state.tab);
    b.classList.toggle('active', b.dataset.tab === state.tab || isMais);
  });

  const main = document.getElementById('main');
  const titles = {
    inicio:['Meu Financeiro', state.orgNome],
    lancar:['Novo Lançamento','Registrar receita, despesa ou transferência'],
    cartoes:['Cartões de Crédito','Faturas, parcelas e compras'],
    extrato:['Lançamentos','Histórico, busca, edição e exclusão'],
    relatorios:['Relatórios','Detalhado por período'],
    mais:['Mais','Investimentos, compromissos e configurações'],
    investimentos:['Investimentos','Aportes e valor atual'],
    compromissos:['Compromissos','Contas fixas, parceladas e recorrentes'],
    categorias:['Categorias','Padronização para os relatórios'],
    contas:['Contas','Caixa, bancos e outras contas'],
    config:['Configurações','Saldos iniciais, organização e backup'],
  };
  const t = titles[state.tab] || titles.inicio;
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];

  switch(state.tab){
    case 'inicio': main.innerHTML = renderInicio(); break;
    case 'lancar': main.innerHTML = renderLancar(); break;
    case 'cartoes': main.innerHTML = renderCartoes(); break;
    case 'extrato': main.innerHTML = renderExtrato(); break;
    case 'relatorios': main.innerHTML = renderRelatorios(); break;
    case 'mais': main.innerHTML = renderMais(); break;
    case 'investimentos': main.innerHTML = renderInvestimentos(); break;
    case 'compromissos': main.innerHTML = renderCompromissos(); break;
    case 'categorias': main.innerHTML = renderCategorias(); break;
    case 'contas': main.innerHTML = renderContas(); break;
    case 'config': main.innerHTML = renderConfig(); break;
  }
  if(!navegando){ main.classList.add('page-enter'); setTimeout(()=>main.classList.remove('page-enter'),600); }
  afterRender();
}

function renderAuth(){

function afterRenderAuth(){
  document.getElementById('btnToggleAuth').addEventListener('click', ()=>{
    state.authMode = state.authMode === 'signup' ? 'login' : 'signup';
    state.authError = null;
    render();
  });
  document.getElementById('formAuth').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = fd.get('email').trim();
    const password = fd.get('password');
    state.authError = null;
    state.authLoading = true;
    render();

    if(state.authMode === 'signup'){
      const nomeOrg = fd.get('nome_organizacao').trim();
      const nomeCompleto = fd.get('nome_completo').trim();
      const rendaMensal = fd.get('renda_mensal') ? parseValor(fd.get('renda_mensal')) : null;
      const bancos = fd.getAll('bancos');
      const { data, error } = await sbClient.auth.signUp({
        email, password,
        options: { data: { nome_organizacao: nomeOrg, nome_completo: nomeCompleto, renda_mensal: rendaMensal, bancos } }
      });
      state.authLoading = false;
      if(error){
        state.authError = error.message;
        render();
        return;
      }
      if(!data.session){
        state.authError = null;
        state.authMode = 'login';
        render();
        showToast('Verifique seu e-mail para confirmar o cadastro.');
        return;
      }
      state.session = data.session;
      await iniciarAppLogado(true);
      return;
    }

    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
    state.authLoading = false;
    if(error){
      state.authError = 'E-mail ou senha inválidos.';
      render();
      return;
    }
    state.session = data.session;
    await iniciarAppLogado(false);
  });
}

async function iniciarAppLogado(recemCadastrado){
  const ok = await carregarOrganizacao();
  if(!ok){
    showToast('Não foi possível carregar sua conta. Tente novamente em instantes.');
    render();
    return;
  }
  await loadAll();
  await seedCategoriasSeVazio();
  await garantirParcelasFuturas();
  if(recemCadastrado || state.precisaDefinirSaldos){
    state.onboardingSaldos = true;
  }
  render();
  if(!recemCadastrado && !state.onboardingSaldos) setTimeout(abrirSplashPendencias, 300);
}

/* ============ PENDÊNCIAS ============ */
function renderPendencias(){
  const hoje = todayISO();
  const limite = addDaysISO(hoje, 7);
  const pendentes = state.parcelasCompromisso
    .filter(p=>p.status==='pendente')
    .map(p=>({...p, compromisso: state.compromissos.find(c=>c.id===p.compromisso_id)}))
    .filter(p=>p.compromisso)
    .sort((a,b)=> a.data_vencimento.localeCompare(b.data_vencimento));
  const atrasados = pendentes.filter(p=>p.data_vencimento < hoje);
  const hojeItens = pendentes.filter(p=>p.data_vencimento === hoje);
  const proximos = pendentes.filter(p=>p.data_vencimento > hoje && p.data_vencimento <= limite);
  if(atrasados.length + hojeItens.length + proximos.length === 0) return '';

  let html = `<div class="card compact">
    <h2 class="section-title">Pendências
      <small>${atrasados.length} atrasada(s) · ${hojeItens.length} vence(m) hoje · ${proximos.length} nos próx. 7 dias</small>
    </h2>`;
  for(const p of atrasados) html += pendenciaItemHTML(p, 'atrasado');
  for(const p of hojeItens) html += pendenciaItemHTML(p, 'hoje');
  for(const p of proximos) html += pendenciaItemHTML(p, 'proximo');
  html += `</div>`;
  return html;
}
function pendenciaItemHTML(p, situacao){
  const c = p.compromisso;
  const labelParcela = p.numero_parcela ? ` (${p.numero_parcela}/${p.total_parcelas})` : '';
  let situLabel;
  if(situacao === 'atrasado') situLabel = `Atrasado desde ${formatDataBR(p.data_vencimento)}`;
  else if(situacao === 'hoje') situLabel = 'Vence hoje';
  else situLabel = `Vence ${formatDataBR(p.data_vencimento)}`;
  const corClasse = situacao === 'proximo' ? '' : 'saida';
  return `<div class="lancamento-item" data-action="confirmar-parcela-compromisso" data-id="${p.id}">
    <span class="dot saida"></span>
    <div class="info">
      <div class="hist">${escHtml(c.descricao)}${labelParcela}</div>
      <div class="meta ${corClasse}">${situLabel} · ${escHtml(categoriaNome(c.categoria_id))}</div>
    </div>
    <div class="valor saida">${formatMoeda(p.valor_previsto)}</div>
  </div>`;
}
function abrirSplashPendencias(){
  const hoje = todayISO();
  const atrasados = state.parcelasCompromisso.filter(p=>p.status==='pendente' && p.data_vencimento < hoje);
  const hojeItens = state.parcelasCompromisso.filter(p=>p.status==='pendente' && p.data_vencimento === hoje);
  if(atrasados.length + hojeItens.length === 0) return;
  document.getElementById('splashRoot').innerHTML = `<div class="splash-overlay" id="splashOverlay">
    <div class="splash">
      <div class="splash-header"><h2>Fique de olho</h2><p>${atrasados.length} atrasada(s) e ${hojeItens.length} vencendo hoje</p></div>

        ${atrasados.length ? '<div class="splash-section-label">Atrasadas</div>' + atrasados.map(p=>splashItemHTML(p,'atrasado')).join('') : ''}
        ${hojeItens.length ? '<div class="splash-section-label">Vencem hoje</div>' + hojeItens.map(p=>splashItemHTML(p,'hoje')).join('') : ''}
      </div>

function splashItemHTML(p, situacao){

/* Parcelas do cartão como "despesas": cada parcela conta na data da compra + (n-1) meses.
   O pagamento da fatura e as transferências entre contas ficam de fora para não duplicar. */
function parcelasCartaoComoLancamentos(){
  const compras = new Map(state.compras.map(c=>[c.id,c]));
  const out = [];
  for(const p of state.parcelasCartao){
    const c = compras.get(p.compra_id);
    if(!c) continue;
    out.push({
      id: p.id,
      data: addMonthsISO(c.data_compra, Number(p.numero_parcela)-1),
      descricao: c.descricao + (c.parcelas_total>1 ? ` (${p.numero_parcela}/${c.parcelas_total})` : ''),
      categoria_id: c.categoria_id,
      tipo: 'despesa',
      valor: Number(p.valor_parcela),
      conta_financeira_id: null,
      compra_id: c.id, cartao_id: c.cartao_id,
      _origem: `Cartão ${cartaoNome(c.cartao_id)}`
    });
  }
  return out;
}
function origemLancamento(l){ return l._origem || contaNome(l.conta_financeira_id); }
/* Pagamento de fatura: criado com transfer_group = id da fatura; os antigos são reconhecidos pela descrição */
function ehPagamentoFatura(l){
  if(l.tipo!=='despesa' || l.categoria_id) return false;
  if(l.transfer_group) return state.faturas.some(f=>f.id===l.transfer_group);
  return /^Fatura /.test(l.descricao||'');
}
function despesasConsolidadas(){
  const out = [];
  for(const l of state.lancamentos){
    if(l.tipo!=='despesa' || l.transfer_group || ehPagamentoFatura(l)) continue;
    out.push({data:l.data, valor:Number(l.valor), categoria_id:l.categoria_id});
  }
  for(const l of parcelasCartaoComoLancamentos()) out.push({data:l.data, valor:l.valor, categoria_id:l.categoria_id});
  return out;
}
function montarDadosFluxo6Meses(){
  const labels = [];
  const receitas = [];
  const despesas = [];
  const todasDespesas = despesasConsolidadas();
  for(let i=5;i>=0;i--){
    const ref = addMonthsISO(firstDayOfMonthISO(), -i);
    const [y,m] = ref.split('-');
    const ym = `${y}-${m}`;
    labels.push(nomeMesCurto(ref));
    receitas.push(round2(state.lancamentos.filter(l=>l.tipo==='receita' && !l.transfer_group && l.data.slice(0,7)===ym).reduce((a,l)=>a+Number(l.valor),0)));
    despesas.push(round2(todasDespesas.filter(d=>d.data.slice(0,7)===ym).reduce((a,d)=>a+d.valor,0)));
  }
  return {labels, receitas, despesas};
}

      }

function mesGastosAtual(){ return state.mesGastos || firstDayOfMonthISO(); }
function gastosPorCategoria(mesISO){
  const ym = mesISO.slice(0,7);
  const out = {};
  for(const d of despesasConsolidadas()){
    if(d.data.slice(0,7)!==ym) continue;
    const key = d.categoria_id || '__sem';
    if(!out[key]) out[key] = {id:key, nome: d.categoria_id ? categoriaNome(d.categoria_id) : 'Sem categoria', valor:0};
    out[key].valor = round2(out[key].valor + d.valor);
  }
  return out;
}
function listaGastosCategoria(mesISO){
  const atual = gastosPorCategoria(mesISO);
  const ant = gastosPorCategoria(addMonthsISO(mesISO,-1));
  return Object.values(atual).map(c=>({...c, anterior: ant[c.id] ? ant[c.id].valor : 0})).sort((a,b)=>b.valor-a.valor);
}
function deltaTxt(atual, anterior){
  if(anterior<=0) return atual>0 ? {t:'novo', c:'eq'} : {t:'', c:'eq'};
  const d = round2(atual-anterior);
  if(Math.abs(d)<0.01) return {t:'= igual', c:'eq'};
  return {t:`${d>0?'▲':'▼'} ${formatMoeda(Math.abs(d))}`, c: d>0 ? 'up' : 'down'};
}
function renderGastosCategoria(){
  const mes = mesGastosAtual();
  const lista = listaGastosCategoria(mes);
  const total = round2(lista.reduce((a,c)=>a+c.valor,0));
  const totalAnt = round2(Object.values(gastosPorCategoria(addMonthsISO(mes,-1))).reduce((a,c)=>a+c.valor,0));
  let html = `<div class="card compact">
    <div class="mes-nav">
      <button type="button" id="btnGastosAnt" aria-label="Mês anterior">‹</button>
      <div class="mn-t"><div class="m">${nomeMesAno(mes)}</div><div class="s">Gastos por categoria · inclui cartão, por parcela</div></div>
      <button type="button" id="btnGastosProx" aria-label="Próximo mês">›</button>
    </div>
    <div class="chart-wrap" style="margin-top:14px;"><canvas id="chartGastosCategoria"></canvas></div>`;
  lista.forEach((c,i)=>{
    const dl = deltaTxt(c.valor, c.anterior);
    const pct = total>0 ? (c.valor/total*100).toFixed(1).replace('.',',') : '0';
    html += `<div class="cat-row" data-action="ver-categoria" data-cat="${c.id}">
      <span class="cat-dot" style="background:${PALETA_MODERNA[i%PALETA_MODERNA.length]};"></span>
      <div class="cat-n">${escHtml(c.nome)}<small>${pct}% do mês</small></div>
      <div class="cat-v">${formatMoeda(c.valor)}${dl.t?`<small class="${dl.c}">${dl.t}</small>`:''}</div>
    </div>`;
  });
  if(lista.length){
    const dt = deltaTxt(total, totalAnt);
    html += `<div class="cat-total"><span>Total do mês</span><span>${formatMoeda(total)}${dt.t&&dt.t!=='novo'?` <small class="${dt.c}">${dt.t} vs. mês anterior</small>`:''}</span></div>`;
  }
  html += `</div>`;
  return html;
}
/* ---------- Previsão ---------- */
function saidasComprometidasAte(limiteISO){
  let total = 0;
  for(const p of state.parcelasCompromisso){
    if(p.status!=='pendente' || p.data_vencimento>limiteISO) continue;
    if(!state.compromissos.some(c=>c.id===p.compromisso_id)) continue;
    total += Number(p.valor_previsto)||0;
  }
  for(const f of state.faturas){
    if(f.status==='paga' || f.data_vencimento>limiteISO) continue;
    total += totalDaFatura(f);
  }
  return round2(total);
}
function renderPrevisao(){
  const hoje = todayISO();
  const d = new Date();
  const fimMes = isoFromDate(new Date(d.getFullYear(), d.getMonth()+1, 0));
  const hs = [{l:'Fim do mês', d:fimMes},{l:'30 dias', d:addDaysISO(hoje,30)},{l:'60 dias', d:addDaysISO(hoje,60)},{l:'90 dias', d:addDaysISO(hoje,90)}]
    .sort((a,b)=>a.d.localeCompare(b.d));
  const saldo = saldoTotal();
  const linhas = hs.map(h=>{ const saidas = saidasComprometidasAte(h.d); return {l:h.l, saidas, proj: round2(saldo - saidas)}; });
  if(linhas.every(x=>x.saidas===0)) return '';
  const critico = linhas.find(x=>x.proj<0);
  let html = `<div class="card compact">
    <h2 class="section-title">Previsão de saldo<small>a partir do saldo atual de ${formatMoeda(saldo)}</small></h2>
    <div class="prev-row head"><span>Até</span><span class="r">Já comprometido</span><span class="r">Saldo projetado</span></div>`;
  for(const x of linhas){
    html += `<div class="prev-row"><span>${x.l}</span><span class="r">- ${formatMoeda(x.saidas)}</span><span class="r ${x.proj<0?'neg':''}">${formatMoeda(x.proj)}</span></div>`;
  }
  if(critico) html += `<div class="alert-txt">Atenção: até ${critico.l.toLowerCase()} os compromissos e faturas superam o saldo atual em ${formatMoeda(-critico.proj)}.</div>`;
  html += `<p class="hint-txt">Considera compromissos pendentes e faturas de cartão em aberto. Não inclui novas receitas nem gastos ainda não lançados.</p></div>`;
  return html;
}

function temColunaOrcamento(){

function renderOrcamento(){
  if(!temColunaOrcamento()) return '';
  const comOrc = state.categorias.filter(c=>c.tipo==='despesa' && Number(c.orcamento_mensal)>0);
  if(!comOrc.length) return '';
  const mes = mesGastosAtual();
  const gastos = gastosPorCategoria(mes);
  const itens = comOrc.map(c=>{
    const orc = Number(c.orcamento_mensal);
    const gasto = gastos[c.id] ? gastos[c.id].valor : 0;
    return {c, orc, gasto, pct: gasto/orc*100};
  }).sort((a,b)=>b.pct-a.pct);
  let html = `<div class="card compact"><h2 class="section-title">Orçamento<small>${nomeMesAno(mes)}</small></h2>`;
  for(const it of itens){
    const nivel = it.pct>100 ? 'over' : (it.pct>=80 ? 'warn' : '');
    const sub = it.pct>100 ? `Passou ${formatMoeda(round2(it.gasto-it.orc))}` : `Restam ${formatMoeda(round2(it.orc-it.gasto))}`;
    html += `<div class="orc-item" data-action="ver-categoria" data-cat="${it.c.id}">

      <div class="orc-sub ${nivel}">${Math.round(it.pct)}% · ${sub}</div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

/* Histórico de descrições (lançamentos e compras no cartão): base da sugestão de categoria e do autocompletar */
function historicoDescricoes(tipo){
  const mapa = new Map();
  const add = (descricao, cat)=>{
    const n = normTxt(descricao);
    if(!n) return;
    let h = mapa.get(n);
    if(!h){ h = {desc:String(descricao).trim(), cats:{}, n:0}; mapa.set(n,h); }
    h.n++;
    if(cat) h.cats[cat] = (h.cats[cat]||0)+1;
  };
  for(const l of state.lancamentos){
    if(l.tipo!==tipo || l.transfer_group || ehPagamentoFatura(l)) continue;
    add(l.descricao, l.categoria_id);
  }
  if(tipo==='despesa') for(const c of state.compras) add(c.descricao, c.categoria_id);
  return mapa;
}
function sugerirCategoria(descricao, tipo){
  const q = normTxt(descricao);
  if(q.length<2) return null;
  const hist = historicoDescricoes(tipo);
  let cats = hist.get(q) ? hist.get(q).cats : null;
  if(!cats || !Object.keys(cats).length){
    cats = {};
    if(q.length>=3) for(const [n,h] of hist){
      if(n.length>=3 && (n.startsWith(q) || q.startsWith(n))) for(const id in h.cats) cats[id] = (cats[id]||0)+h.cats[id];
    }
  }
  let melhor = null, max = 0;
  for(const id in cats) if(cats[id]>max){ max = cats[id]; melhor = id; }
  return melhor && state.categorias.some(c=>c.id===melhor && c.tipo===tipo) ? melhor : null;
}

        <div><label>Categoria</label>

function afterRenderLancar(){
  const btnIr = document.getElementById('btnIrContasLancar');
  if(btnIr){ btnIr.addEventListener('click', ()=>{ state.tab='contas'; render(); }); return; }
  document.querySelectorAll('[data-tipo]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.lancarTipo = b.dataset.tipo;
      render();
    });
  });
  const form = document.getElementById('formLancar');
  if(!form) return;
  setTimeout(()=>{ try{ form.elements['valor'].focus({preventScroll:true}); }catch(e){} }, 80);

  /* Categoria sugerida pelo histórico, enquanto você não escolher uma manualmente */
  const selCat = form.elements['categoria'];
  const inpDesc = form.elements['descricao'];
  let categoriaManual = false;
  if(selCat && inpDesc){
    selCat.addEventListener('change', ()=>{ categoriaManual = true; });
    const sugerir = ()=>{
      if(categoriaManual) return;
      const id = sugerirCategoria(inpDesc.value, state.lancarTipo);
      if(id && Array.from(selCat.options).some(o=>o.value===id)) selCat.value = id;
    };
    inpDesc.addEventListener('input', sugerir);
    inpDesc.addEventListener('change', sugerir);
  }

  /* Forma de pagamento: alterna conta x cartão sem re-renderizar (não perde o que já foi digitado) */
  const segForma = document.getElementById('segForma');
  const atualizarHint = ()=>{
    const el = document.getElementById('hintFatura');
    if(!el) return;
    if(state.lancarForma!=='cartao'){ el.textContent=''; return; }
    const fd = new FormData(form);
    const c = state.cartoes.find(x=>x.id===fd.get('cartao'));
    el.textContent = infoFaturaDaCompra(c, fd.get('data'), Math.max(1, parseInt(fd.get('parcelas'),10)||1), parseValor(fd.get('valor')));
  };
  if(segForma){
    const aplicarForma = ()=>{
      const card = state.lancarForma==='cartao';
      const mostrar = (id, show)=>{ const el=document.getElementById(id); if(el) el.hidden=!show; };
      mostrar('wrapConta', !card); mostrar('wrapCartao', card); mostrar('wrapParcelas', card);
      const desab = (nome, d)=>{ const el=form.elements[nome]; if(el) el.disabled=d; };
      desab('conta', card); desab('cartao', !card); desab('parcelas', !card);
      segForma.querySelectorAll('[data-forma]').forEach(b=>b.classList.toggle('active', b.dataset.forma===(card?'cartao':'conta')));
      document.getElementById('lblValor').textContent = card ? 'Valor total' : 'Valor';
      atualizarHint();
    };
    segForma.querySelectorAll('[data-forma]').forEach(b=>b.addEventListener('click', ()=>{ state.lancarForma = b.dataset.forma; lsSet('forma', state.lancarForma); aplicarForma(); }));
    form.addEventListener('input', atualizarHint);
    form.addEventListener('change', atualizarHint);
    atualizarHint();
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const valor = parseValor(fd.get('valor'));
    const data = fd.get('data');
    const descricao = fd.get('descricao') || null;
    if(valor <= 0){ showToast('Informe um valor maior que zero.'); return; }

    /* Despesa no cartão: vira compra + parcelas na fatura correspondente */
    if(state.lancarTipo==='despesa' && state.lancarForma==='cartao' && state.cartoes.length>0){
      const cartao = state.cartoes.find(c=>c.id===fd.get('cartao'));
      if(!cartao){ showToast('Escolha um cartão.'); return; }
      const numParcelas = Math.max(1, parseInt(fd.get('parcelas'),10)||1);
      const categoriaId = fd.get('categoria') || null;
      const res = await salvarCompraCartao({
        cartao, compraExistente:null, descricao: descricao || categoriaNome(categoriaId),
        valorTotal: valor, numParcelas, dataCompra: data, categoriaId
      });
      if(!res) return;
      lsSet('cartao', cartao.id); lsSet('forma', 'cartao');
      state.faturaCartaoId = cartao.id;
      state.faturaMes = res.primeiraFatura;
      showToast(`Compra lançada na fatura de ${nomeMesAno(res.primeiraFatura)}.`);
      setTab('inicio');
      return;
    }

    if(state.lancarTipo === 'transferencia'){
      const origem = fd.get('contaOrigem');
      const destino = fd.get('contaDestino');
      if(origem === destino){ showToast('Escolha contas diferentes.'); return; }
      const grupo = crypto.randomUUID();
      await dbAdd('lancamentos', {conta_financeira_id:origem, categoria_id:null, tipo:'despesa', valor, data, descricao: descricao || `Transferência para ${contaNome(destino)}`, transfer_group:grupo});
      await dbAdd('lancamentos', {conta_financeira_id:destino, categoria_id:null, tipo:'receita', valor, data, descricao: descricao || `Transferência de ${contaNome(origem)}`, transfer_group:grupo});
    } else {
      await dbAdd('lancamentos', {
        conta_financeira_id: fd.get('conta'),
        categoria_id: fd.get('categoria'),
        tipo: state.lancarTipo,
        valor, data, descricao
      });
      lsSet('conta', fd.get('conta'));
      if(state.lancarTipo==='despesa') lsSet('forma', 'conta');
    }
    state.lancamentos = await dbGetAll('lancamentos', {col:'data', asc:false});
    form.reset();
    showToast('Lançamento salvo.');
    setTab('inicio');
  });
}

function itensExtrato(){
  const e = state.extrato;
  const ym = (e.mes || firstDayOfMonthISO()).slice(0,7);
  const itens = [];
  for(const l of state.lancamentos){
    if(l.data.slice(0,7)!==ym) continue;
    const pag = ehPagamentoFatura(l);
    itens.push({k:'l', id:l.id, data:l.data, descricao:l.descricao||categoriaNome(l.categoria_id), valor:Number(l.valor), tipo:l.tipo,
      categoria_id:l.categoria_id, origem:contaNome(l.conta_financeira_id), pag, transf: !!l.transfer_group && !pag});
  }
  for(const p of parcelasCartaoComoLancamentos()){
    if(p.data.slice(0,7)!==ym) continue;
    itens.push({k:'p', id:p.id, compra_id:p.compra_id, cartao_id:p.cartao_id, data:p.data, descricao:p.descricao, valor:p.valor, tipo:'despesa',
      categoria_id:p.categoria_id, origem:p._origem, pag:false, transf:false});
  }
  const q = normTxt(e.busca);
  return itens.filter(it=>{
    if(e.categoria){
      if(it.pag || it.transf) return false;
      if(e.categoria==='__sem'){ if(it.tipo!=='despesa' || it.categoria_id) return false; }
      else if(it.categoria_id!==e.categoria) return false;
    }
    if(q){
      const alvo = normTxt(`${it.descricao} ${it.origem} ${it.categoria_id?categoriaNome(it.categoria_id):''} ${String(it.valor.toFixed(2)).replace('.',',')}`);
      if(!alvo.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>b.data.localeCompare(a.data));
}
function htmlResumoExtrato(itens){
  const rec = round2(itens.filter(i=>i.tipo==='receita' && !i.transf).reduce((a,i)=>a+i.valor,0));
  const des = round2(itens.filter(i=>i.tipo==='despesa' && !i.transf && !i.pag).reduce((a,i)=>a+i.valor,0));
  return `<div class="stat-grid" style="margin-top:14px;">
    <div class="stat-tile inv"><div class="st-label">Receitas</div><div class="st-value" style="color:var(--accent-ink);">${formatMoeda(rec)}</div></div>
    <div class="stat-tile fat"><div class="st-label">Despesas</div><div class="st-value" style="color:var(--saida);">${formatMoeda(des)}</div></div>
  </div>`;
}
function htmlListaExtrato(itens){
  if(!itens.length) return `<div class="empty">Nenhum lançamento encontrado.</div>`;
  return itens.map(it=>{
    const neutro = it.pag || it.transf;
    const cls = neutro ? '' : (it.tipo==='despesa' ? 'saida' : 'entrada');
    const sinal = neutro ? '' : (it.tipo==='despesa' ? '- ' : '+ ');
    const extra = it.pag ? ' · pagamento de fatura' : (it.transf ? ' · transferência' : '');
    const attrs = it.k==='p' ? `data-k="p" data-compra="${it.compra_id}" data-cartao="${it.cartao_id}"` : `data-k="l" data-id="${it.id}"`;
    return `<div class="lancamento-item" ${attrs}>
      <span class="dot ${neutro?'':cls}" ${neutro?'style="background:var(--ink-3);"':''}></span>
      <div class="info">
        <div class="hist">${escHtml(it.descricao)}</div>
        <div class="meta">${formatDataBR(it.data)} · ${escHtml(it.origem)}${it.categoria_id?' · '+escHtml(categoriaNome(it.categoria_id)):''}${extra}</div>
      </div>
      <div class="valor ${cls}">${sinal}${formatMoeda(it.valor)}</div>
    </div>`;
  }).join('');
}

function abrirModalLancamento(id){
  const l = state.lancamentos.find(x=>x.id===id);
  if(!l) return;
  if(ehPagamentoFatura(l)){
    if(l.transfer_group && state.faturas.some(f=>f.id===l.transfer_group)){
      showToast('Pagamento de fatura: para alterar, reabra a fatura.');
      irParaFatura(l.transfer_group);
    } else {
      showToast('Pagamento de fatura: para desfazer, reabra a fatura em Cartões.');
    }
    return;
  }
  let legs = null;
  if(l.transfer_group){
    const todos = state.lancamentos.filter(x=>x.transfer_group===l.transfer_group);
    const saida = todos.find(x=>x.tipo==='despesa'), entrada = todos.find(x=>x.tipo==='receita');
    if(saida && entrada) legs = {saida, entrada};
  }
  const opcoesConta = (sel)=>state.contas.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${escHtml(c.nome)}</option>`).join('');
  let campos;
  if(legs){
    const desc = /^Transferência (para|de) /.test(legs.saida.descricao||'') ? '' : (legs.saida.descricao||'');
    campos = `
      <label>Descrição (opcional)</label>
      <input type="text" name="descricao" value="${escHtml(desc)}" placeholder="Transferência entre contas">
      <div class="filters-grid">
        <div><label>Valor</label><input type="text" name="valor" inputmode="decimal" required value="${String(legs.saida.valor).replace('.',',')}"></div>
        <div><label>Data</label><input type="date" name="data" required value="${legs.saida.data}"></div>
      </div>
      <div class="filters-grid">
        <div><label>Conta de origem</label><select name="origem">${opcoesConta(legs.saida.conta_financeira_id)}</select></div>
        <div><label>Conta de destino</label><select name="destino">${opcoesConta(legs.entrada.conta_financeira_id)}</select></div>
      </div>
      <p class="note">As duas pontas da transferência são alteradas juntas.</p>`;
  } else {
    const cats = state.categorias.filter(c=>c.tipo===l.tipo);
    campos = `
      <label>Descrição</label>
      <input type="text" name="descricao" value="${escHtml(l.descricao||'')}" list="dlDescricoes" autocomplete="off">
      <div class="filters-grid">
        <div><label>Valor</label><input type="text" name="valor" inputmode="decimal" required value="${String(l.valor).replace('.',',')}"></div>
        <div><label>Data</label><input type="date" name="data" required value="${l.data}"></div>
      </div>
      <div class="filters-grid">
        <div><label>Conta</label><select name="conta">${opcoesConta(l.conta_financeira_id)}</select></div>
        <div><label>Categoria</label><select name="categoria">
          ${l.categoria_id ? '' : `<option value="" selected>Sem categoria</option>`}
          ${cats.map(c=>`<option value="${c.id}" ${c.id===l.categoria_id?'selected':''}>${escHtml(c.nome)}</option>`).join('')}
        </select></div>
      </div>`;
  }
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>${legs?'Editar transferência':(l.tipo==='despesa'?'Editar despesa':'Editar receita')}</h3>
      <form id="formLanc">
        ${campos}
        <div class="btn-row">
          <button type="button" class="btn danger small" id="btnExcluirLanc">Excluir</button>
          <button type="submit" class="btn small" style="flex:1;">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') fecharModal(); });
  document.getElementById('formLanc').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const valor = parseValor(fd.get('valor'));
    const data = fd.get('data');
    if(valor<=0 || !data){ showToast('Confira valor e data.'); return; }
    const descricao = (fd.get('descricao')||'').trim() || null;
    try{
      if(legs){
        const origem = fd.get('origem'), destino = fd.get('destino');
        if(origem===destino){ showToast('Escolha contas diferentes.'); return; }
        await dbPut('lancamentos', {id:legs.saida.id, conta_financeira_id:origem, valor, data, descricao: descricao || `Transferência para ${contaNome(destino)}`});
        await dbPut('lancamentos', {id:legs.entrada.id, conta_financeira_id:destino, valor, data, descricao: descricao || `Transferência de ${contaNome(origem)}`});
      } else {
        await dbPut('lancamentos', {id:l.id, conta_financeira_id:fd.get('conta'), categoria_id:fd.get('categoria')||null, valor, data, descricao});
      }
    }catch(err){ console.error(err); return; }
    await recarregarLancamentos();
    fecharModal(); render(); showToast('Lançamento atualizado.');
  });
  document.getElementById('btnExcluirLanc').addEventListener('click', async ()=>{
    if(!confirm(legs ? 'Excluir esta transferência (as duas pontas)?' : 'Excluir este lançamento?')) return;
    try{
      if(legs){ await dbDelete('lancamentos', legs.saida.id); await dbDelete('lancamentos', legs.entrada.id); }
      else await dbDelete('lancamentos', l.id);
    }catch(err){ console.error(err); }
    await recarregarLancamentos();
    fecharModal(); render(); showToast('Lançamento excluído.');
  });
}

/* ============ CARTÕES ============ */
function ultimoDiaUtilDoMes(ano, mesIndex0){
  const d = new Date(ano, mesIndex0+1, 0);
  const dow = d.getDay();
  if(dow===0) d.setDate(d.getDate()-2);
  else if(dow===6) d.setDate(d.getDate()-1);
  return d;
}
function dataFechamentoDoMes(cartao, ano, mesIndex0){
  return cartao.fechamento_ultimo_dia_util ? ultimoDiaUtilDoMes(ano, mesIndex0) : new Date(ano, mesIndex0, cartao.dia_fechamento);
}
function calcularMesFatura(cartao, dataCompraISO, offsetParcelas){
  const d = new Date(dataCompraISO+'T00:00:00');
  let mes = d.getMonth();
  let ano = d.getFullYear();
  const fechamentoDoMes = dataFechamentoDoMes(cartao, ano, mes);
  if(d > fechamentoDoMes) mes += 1;
  mes += offsetParcelas;
  const ref = new Date(ano, mes, 1);
  return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-01`;
}
function datasDaFatura(cartao, mesReferencia){
  const [y,m] = mesReferencia.split('-').map(Number);
  const fechamento = dataFechamentoDoMes(cartao, y, m-1);
  let vencimento = new Date(y, m-1, cartao.dia_vencimento);
  if(cartao.dia_vencimento <= fechamento.getDate()) vencimento = new Date(y, m, cartao.dia_vencimento);
  return {fechamento: isoFromDate(fechamento), vencimento: isoFromDate(vencimento)};
}
async function garantirFatura(cartao, mesReferencia){
  let fatura = state.faturas.find(f=>f.cartao_id===cartao.id && f.mes_referencia===mesReferencia);
  if(fatura) return fatura;
  const datas = datasDaFatura(cartao, mesReferencia);
  fatura = await dbAdd('faturas_cartao', {
    cartao_id: cartao.id, mes_referencia: mesReferencia,
    data_fechamento: datas.fechamento, data_vencimento: datas.vencimento,
    valor_total: 0, status: 'aberta'
  });
  state.faturas.push(fatura);
  return fatura;
}
function mesFaturaAtual(cartao){ return calcularMesFatura(cartao, todayISO(), 0); }
function faturaDoMes(cartaoId, mes){ return state.faturas.find(f=>f.cartao_id===cartaoId && f.mes_referencia===mes) || null; }
/* Data sugerida para um lançamento que deve cair na fatura do mês informado (ciclo = fechamento anterior + 1 dia até o fechamento) */
function dataPadraoNaFatura(cartao, mes){
  const fim = datasDaFatura(cartao, mes).fechamento;
  const inicio = addDaysISO(datasDaFatura(cartao, addMonthsISO(mes,-1)).fechamento, 1);
  const hoje = todayISO();
  return hoje < inicio ? inicio : (hoje > fim ? fim : hoje);
}
function infoFaturaDaCompra(cartao, dataISO, numParcelas, valorTotal){
  if(!cartao || !dataISO) return '';
  const mes = calcularMesFatura(cartao, dataISO, 0);
  const venc = datasDaFatura(cartao, mes).vencimento;
  let t = `Entra na fatura de ${nomeMesAno(mes)} · vence ${formatDataBR(venc)}`;
  if(numParcelas>1){
    const ult = calcularMesFatura(cartao, dataISO, numParcelas-1);
    t += ` · ${numParcelas}x${valorTotal>0?` de ${formatMoeda(round2(valorTotal/numParcelas))}`:''} até ${nomeMesCurto(ult)}/${ult.slice(0,4)}`;
  }
  return t;
}
function totalDaFatura(fatura){
  if(!fatura) return 0;
  return round2(state.parcelasCartao.filter(p=>p.fatura_id===fatura.id).reduce((a,p)=>a+Number(p.valor_parcela),0));
}
function compraTravada(compraId){
  return state.parcelasCartao.some(p=>{
    if(p.compra_id!==compraId) return false;
    const f = state.faturas.find(x=>x.id===p.fatura_id);
    return f && f.status==='paga';
  });
}
function irParaFatura(faturaId){
  const f = state.faturas.find(x=>x.id===faturaId);
  if(!f) return;
  state.faturaCartaoId = f.cartao_id;
  state.faturaMes = f.mes_referencia;
  if(state.tab==='cartoes') render(); else setTab('cartoes');
}
function garantirSelecaoFatura(){
  if(!state.cartoes.length) return null;
  let cartao = state.cartoes.find(c=>c.id===state.faturaCartaoId);
  if(!cartao){ cartao = state.cartoes[0]; state.faturaCartaoId = cartao.id; state.faturaMes = null; }
  if(!state.faturaMes) state.faturaMes = mesFaturaAtual(cartao);
  return cartao;
}

function renderCartoes(){
  const cartao = garantirSelecaoFatura();
  if(!cartao){
    return `<div class="card"><div class="empty">Nenhum cartão cadastrado.</div></div>
      <button class="btn secondary" id="btnNovoCartao">+ Novo cartão</button>`;
  }
  const mes = state.faturaMes;
  const fatura = faturaDoMes(cartao.id, mes);
  const datas = fatura ? {fechamento: fatura.data_fechamento, vencimento: fatura.data_vencimento} : datasDaFatura(cartao, mes);
  const paga = !!fatura && fatura.status==='paga';
  const status = paga ? 'paga' : (todayISO() > datas.fechamento ? 'fechada' : 'aberta');
  const itens = (fatura ? state.parcelasCartao.filter(p=>p.fatura_id===fatura.id) : [])
    .map(p=>({p, compra: state.compras.find(c=>c.id===p.compra_id)}))
    .filter(x=>x.compra)
    .sort((a,b)=>a.compra.data_compra.localeCompare(b.compra.data_compra));
  const total = totalDaFatura(fatura);
  const ehAtual = mes === mesFaturaAtual(cartao);

  let html = '';
  if(state.cartoes.length>1){
    html += `<div class="card compact" style="padding:14px 16px;">

        <div class="m">${nomeMesAno(mes)}</div>

      </div>
      <button type="button" id="btnMesProx" aria-label="Próxima fatura">›</button>
    </div>
    ${ehAtual ? '' : `<div style="text-align:center;margin-top:10px;"><button type="button" class="link-btn" id="btnFaturaAtual">Ir para a fatura atual</button></div>`}
    <div class="fat-resumo">
      <div class="fr-total">${formatMoeda(total)}</div>
      <div class="fr-sub">Fecha ${formatDataBR(datas.fechamento)} · vence ${formatDataBR(datas.vencimento)}</div>
    </div>`;
  if(itens.length===0){
    html += `<div class="empty" style="padding:24px 12px;">Nenhum lançamento nesta fatura.</div>`;
  }
  for(const {p, compra} of itens){
    const labelParcela = compra.parcelas_total>1 ? ` (${p.numero_parcela}/${compra.parcelas_total})` : '';
    html += `<div class="lancamento-item" data-action="editar-compra" data-cartao="${cartao.id}" data-id="${compra.id}">
      <span class="dot saida"></span>
      <div class="info">
        <div class="hist">${escHtml(compra.descricao)}${labelParcela}</div>
        <div class="meta">${formatDataBR(compra.data_compra)} · ${escHtml(categoriaNome(compra.categoria_id))}</div>
      </div>
      <div class="valor saida">${formatMoeda(p.valor_parcela)}</div>
    </div>`;
  }
  if(!paga){
    html += `<button type="button" class="btn secondary" id="btnNovoLancFatura">+ Lançamento nesta fatura</button>`;

async function recalcularTotalFatura(faturaId){
  const total = round2(state.parcelasCartao
    .filter(p=>p.fatura_id===faturaId)
    .reduce((a,p)=>a+Number(p.valor_parcela),0));
  const fatura = state.faturas.find(f=>f.id===faturaId);
  if(fatura){
    await dbPut('faturas_cartao', {id: faturaId, valor_total: total});
    fatura.valor_total = total;
  }
  return total;
}
async function removerParcelasDaCompra(compraId){
  const parcelasDaCompra = state.parcelasCartao.filter(p=>p.compra_id===compraId);
  const faturasAfetadas = [...new Set(parcelasDaCompra.map(p=>p.fatura_id))];
  for(const p of parcelasDaCompra){
    await dbDelete('parcelas_cartao', p.id);
  }
  state.parcelasCartao = state.parcelasCartao.filter(p=>p.compra_id!==compraId);
  for(const fid of faturasAfetadas){
    await recalcularTotalFatura(fid);
  }
}
function planejarParcelasCompra(cartao, dataCompra, numParcelas, valorTotal){
  const base = round2(valorTotal/numParcelas);
  let acumulado = 0;
  const plano = [];
  for(let i=1;i<=numParcelas;i++){
    const valor = i===numParcelas ? round2(valorTotal - acumulado) : base;
    acumulado = round2(acumulado + valor);
    plano.push({numero:i, mesRef: calcularMesFatura(cartao, dataCompra, i-1), valor});
  }
  return plano;
}
let salvandoCompra = false;
/* Ponto único de gravação de compra no cartão (usado pela tela Lançar e pelo modal da fatura).
   Retorna {compra, primeiraFatura} ou false se não gravou. */
async function salvarCompraCartao({cartao, compraExistente, descricao, valorTotal, numParcelas, dataCompra, categoriaId}){
  if(salvandoCompra) return false;
  if(compraExistente && compraTravada(compraExistente.id)){
    showToast('Há parcelas em fatura já paga. Reabra a fatura para alterar esta compra.');
    return false;
  }
  const plano = planejarParcelasCompra(cartao, dataCompra, numParcelas, valorTotal);
  for(const it of plano){
    const f = faturaDoMes(cartao.id, it.mesRef);
    if(f && f.status==='paga'){
      showToast(`A fatura de ${nomeMesAno(it.mesRef)} já está paga. Reabra-a antes de incluir lançamentos nela.`);
      return false;
    }
  }
  salvandoCompra = true;
  try{
    if(compraExistente) await removerParcelasDaCompra(compraExistente.id);
    const campos = {
      cartao_id: cartao.id, categoria_id: categoriaId || null,
      descricao, valor_total: valorTotal, parcelas_total: numParcelas, data_compra: dataCompra
    };
    const compra = compraExistente
      ? await dbPut('compras_cartao', {id: compraExistente.id, ...campos})
      : await dbAdd('compras_cartao', campos);
    const afetadas = new Set();
    for(const it of plano){
      const fatura = await garantirFatura(cartao, it.mesRef);
      const parcela = await dbAdd('parcelas_cartao', {compra_id: compra.id, fatura_id: fatura.id, numero_parcela: it.numero, valor_parcela: it.valor, status:'pendente'});
      state.parcelasCartao.push(parcela);
      afetadas.add(fatura.id);
    }
    for(const fid of afetadas) await recalcularTotalFatura(fid);
    await loadAll();
    return {compra, primeiraFatura: plano[0].mesRef};
  }catch(err){
    console.error(err);
    await loadAll();
    return false;
  }finally{
    salvandoCompra = false;
  }
}

async function pagarFatura(fatura, cartao, contaId, dataPagamento){
  const total = totalDaFatura(fatura);
  if(total<=0) return;
  const parcelas = state.parcelasCartao.filter(p=>p.fatura_id===fatura.id);
  /* transfer_group = id da fatura: liga o pagamento à fatura (para reabrir) e o tira dos gráficos, que já contam as compras */
  await dbAdd('lancamentos', {
    conta_financeira_id: contaId, categoria_id: null, tipo:'despesa',
    valor: total, data: dataPagamento,
    descricao: `Fatura ${cartao.nome} — ${nomeMesAno(fatura.mes_referencia)}`,
    transfer_group: fatura.id
  });
  await dbPut('faturas_cartao', {id: fatura.id, status:'paga', valor_total: total});
  for(const p of parcelas) await dbPut('parcelas_cartao', {id: p.id, status:'paga'});
  await loadAll();
}
async function reabrirFatura(fatura, cartao){
  const nomeEsperado = `Fatura ${cartao.nome} — ${nomeMesAno(fatura.mes_referencia)}`;
  let pag = state.lancamentos.find(l=>l.transfer_group===fatura.id);
  if(!pag) pag = state.lancamentos.find(l=>l.tipo==='despesa' && !l.categoria_id && !l.transfer_group && l.descricao===nomeEsperado);
  const msg = pag
    ? `Reabrir esta fatura exclui o lançamento do pagamento (${formatMoeda(pag.valor)} em ${formatDataBR(pag.data)}) e devolve o valor à conta. Continuar?`
    : 'Não encontrei o lançamento do pagamento desta fatura. Reabrir mesmo assim? O saldo da conta não será alterado.';
  if(!confirm(msg)) return;
  try{
    if(pag) await dbDelete('lancamentos', pag.id);
    await dbPut('faturas_cartao', {id: fatura.id, status:'aberta'});
    for(const p of state.parcelasCartao.filter(x=>x.fatura_id===fatura.id)) await dbPut('parcelas_cartao', {id: p.id, status:'pendente'});
  }catch(err){ console.error(err); }
  await loadAll();
  render(); showToast('Fatura reaberta.');
}

/* ============ COMPROMISSOS ============ */
async function garantirParcelasFuturas(){
  const hoje = todayISO();
  const limite = addMonthsISO(hoje, 3);
  for(const c of state.compromissos){
    if(!c.ativo || c.tipo !== 'recorrente') continue;
    const parcelasDoCompromisso = state.parcelasCompromisso.filter(p=>p.compromisso_id===c.id);
    let ultima = parcelasDoCompromisso.length ? parcelasDoCompromisso.reduce((a,b)=>a.data_vencimento>b.data_vencimento?a:b) : null;
    let proximaData = ultima ? addMonthsISO(ultima.data_vencimento, 1) : (c.data_inicio || hoje);
    while(proximaData <= limite){
      const nova = await dbAdd('compromissos_parcelas', {
        compromisso_id: c.id, data_vencimento: proximaData,
        valor_previsto: c.valor_previsto, status:'pendente'
      });
      state.parcelasCompromisso.push(nova);
      proximaData = addMonthsISO(proximaData, 1);
    }
  }
}

function afterRenderCompromissos(){

  const form = document.getElementById('formCompromisso');

    e.preventDefault();
    const fd = new FormData(form);
    const tipo = state.compromissoTipo;
    const valor = parseValor(fd.get('valor'));
    const compromisso = await dbAdd('compromissos', {
      descricao: fd.get('descricao'), tipo,
      categoria_id: fd.get('categoria') || null,
      conta_financeira_id: fd.get('conta') || null,
      valor_previsto: valor, valor_variavel: false,
      dia_vencimento: tipo!=='parcelado' ? Number(fd.get('diaVencimento')) : null,
      data_inicio: fd.get('dataInicio') || null,
      num_parcelas: tipo==='parcelado' ? Number(fd.get('numParcelas')) : null,
      ativo: true, observacoes: null
    });
    state.compromissos.push(compromisso);

    if(tipo === 'parcelado'){
      const n = Number(fd.get('numParcelas'));
      for(let i=1;i<=n;i++){
        const dv = addMonthsISO(fd.get('dataInicio'), i-1);
        const nova = await dbAdd('compromissos_parcelas', {compromisso_id: compromisso.id, numero_parcela:i, total_parcelas:n, data_vencimento:dv, valor_previsto: valor, status:'pendente'});
        state.parcelasCompromisso.push(nova);
      }
    } else if(tipo === 'fixo'){
      const dv = fd.get('dataInicio');
      const nova = await dbAdd('compromissos_parcelas', {compromisso_id: compromisso.id, data_vencimento: dv, valor_previsto: valor, status:'pendente'});
      state.parcelasCompromisso.push(nova);
    } else {
      await garantirParcelasFuturas();
    }
    render();
    showToast('Compromisso cadastrado.');
  });
  document.querySelectorAll('[data-action="inativar-compromisso"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('Inativar este compromisso? Parcelas pendentes serão canceladas.')) return;
      const id = el.dataset.id;
      await dbPut('compromissos', {id, ativo:false});
      const pendentesDele = state.parcelasCompromisso.filter(p=>p.compromisso_id===id && p.status==='pendente');
      for(const p of pendentesDele) await dbPut('compromissos_parcelas', {id:p.id, status:'cancelado'});
      await loadAll();
      render();
      showToast('Compromisso inativado.');
    });
  });
  document.querySelectorAll('[data-action="confirmar-parcela-compromisso"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const p = state.parcelasCompromisso.find(x=>x.id===el.dataset.id);
      const c = state.compromissos.find(x=>x.id===p.compromisso_id);
      if(!confirm(`Confirmar pagamento de "${c.descricao}" no valor de ${formatMoeda(p.valor_previsto)}?`)) return;
      const lanc = await dbAdd('lancamentos', {
        conta_financeira_id: c.conta_financeira_id, categoria_id: c.categoria_id,
        tipo:'despesa', valor: p.valor_previsto, data: todayISO(), descricao: c.descricao
      });
      await dbPut('compromissos_parcelas', {id: p.id, status:'pago', lancamento_id: lanc.id, valor_pago: p.valor_previsto});
      await loadAll();
      const splashOv = document.getElementById('splashOverlay');
      if(splashOv){ splashOv.classList.add('closing'); setTimeout(()=>{ document.getElementById('splashRoot').innerHTML=''; }, 180); }
      else document.getElementById('splashRoot').innerHTML = '';
      render();
      showToast('Pagamento confirmado.');
    });
  });
}

function afterRenderRelatorios(){

    state.reportFilters = filtros;
    const base = state.lancamentos.filter(l=>{
      if(l.data < filtros.de || l.data > filtros.ate) return false;
      if(filtros.conta) return l.conta_financeira_id === filtros.conta;
      return !ehPagamentoFatura(l);
    });
    const doCartao = filtros.conta ? [] : parcelasCartaoComoLancamentos().filter(l=>l.data >= filtros.de && l.data <= filtros.ate);
    const lancamentosFiltrados = [...base, ...doCartao].sort((a,b)=>a.data.localeCompare(b.data));
    const totalReceitas = round2(lancamentosFiltrados.filter(l=>l.tipo==='receita').reduce((a,l)=>a+Number(l.valor),0));
    const totalDespesas = round2(lancamentosFiltrados.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+Number(l.valor),0));
    state.reportResult = {lancamentos: lancamentosFiltrados, totalReceitas, totalDespesas};
    render();
  });
  const btnCsv = document.getElementById('btnExportarCSV');
  if(btnCsv) btnCsv.addEventListener('click', ()=>{
    const r = state.reportResult;
    const rows = [['Data','Descrição','Categoria','Conta','Tipo','Valor']];
    for(const l of r.lancamentos) rows.push([formatDataBR(l.data), l.descricao||'', categoriaNome(l.categoria_id), origemLancamento(l), l.tipo, String(l.valor).replace('.',',')]);
    downloadFile(toCSV(rows), `relatorio_${todayISO()}.csv`, 'text/csv;charset=utf-8;');

  if(btnPdf) btnPdf.addEventListener('click', ()=>{

    const doc = new jspdf.jsPDF();
    doc.setFontSize(14); doc.text(state.orgNome || 'Relatório Financeiro', 14, 16);
    doc.setFontSize(10); doc.text(`Período: ${formatDataBR(state.reportFilters.de)} a ${formatDataBR(state.reportFilters.ate)}`, 14, 23);

      startY: 28,
      head: [['Data','Descrição','Categoria','Conta','Valor']],
      body: r.lancamentos.map(l=>[formatDataBR(l.data), l.descricao||'', categoriaNome(l.categoria_id), origemLancamento(l), (l.tipo==='despesa'?'-':'+')+' '+formatMoeda(l.valor)]),

  });
  renderizarChartCategorias();
}
function renderizarChartCategorias(){
  const canvas = document.getElementById('chartCategorias');
  if(!canvas || !state.reportResult) return;
  const porCategoria = {};
  for(const l of state.reportResult.lancamentos){
    if(l.tipo!=='despesa') continue;
    const nome = categoriaNome(l.categoria_id);
    porCategoria[nome] = (porCategoria[nome]||0) + Number(l.valor);
  }
  const labels = Object.keys(porCategoria);
  const valores = Object.values(porCategoria);
  const totalGeral = valores.reduce((a,b)=>a+b,0);
  if(chartCategoriasInstance) chartCategoriasInstance.destroy();
  if(labels.length===0){
    canvas.parentElement.innerHTML = '<div class="empty">Sem despesas no período.</div>';
    return;
  }
  chartCategoriasInstance = new Chart(canvas, {
    type:'doughnut',
    data:{labels, datasets:[{data:valores, backgroundColor:PALETA_MODERNA, borderWidth:3, borderColor:'#fff', hoverOffset:8, borderRadius:6}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'70%',
      plugins:{
        centerTextTotal: totalGeral,
        legend:{position:'bottom', labels:{font:{size:10.5, weight:'700'}, color:'#9AA0BE', usePointStyle:true, pointStyle:'circle', boxWidth:6, boxHeight:6, padding:12}},
        tooltip:{backgroundColor:'#12142E', padding:12, cornerRadius:14, callbacks:{label:(c)=>` ${c.label}: ${formatMoeda(c.parsed)} (${totalGeral>0?((c.parsed/totalGeral*100).toFixed(1)).replace('.',',')+'%':''})`}}
      }},
    plugins:[centerTextPlugin]
  });
}
