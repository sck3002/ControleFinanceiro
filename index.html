  </div>
  <div class="card">
    <button class="btn ghost" id="btnSair">Sair da conta</button>
    <button class="btn danger" id="btnExcluirConta" style="margin-top:10px;">Excluir minha conta</button>
  </div>`;
}
function afterRenderConfig(){
  document.getElementById('formOrg').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const nome = fd.get('nome');
    const rendaMensal = fd.get('rendaMensal') ? parseValor(fd.get('rendaMensal')) : null;
    await dbPut('organizacoes', {id: state.orgId, nome, renda_mensal: rendaMensal});
    state.orgNome = nome;
    state.rendaMensal = rendaMensal;
    render(); showToast('Dados atualizados.');
  });
  document.getElementById('formSaldos').addEventListener('submit', async (e)=>{
    e.preventDefault();
    await salvarSaldosIniciais(new FormData(e.target));
    render(); showToast('Saldos atualizados.');
  });
  document.getElementById('btnBackup').addEventListener('click', ()=>{
    const backup = {
      versao:1, exportadoEm: new Date().toISOString(), organizacao: state.orgNome,
      contas: state.contas, categorias: state.categorias, lancamentos: state.lancamentos,
      cartoes: state.cartoes, faturas: state.faturas, compras: state.compras, parcelasCartao: state.parcelasCartao,
      investimentos: state.investimentos, aportes: state.aportes,
      compromissos: state.compromissos, parcelasCompromisso: state.parcelasCompromisso,
    };
    downloadFile(JSON.stringify(backup,null,2), `backup_financeiro_${todayISO()}.json`, 'application/json');
    showToast('Backup exportado.');
  });
  document.getElementById('inputRestaurar').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    showToast('Restauração de backup é feita manualmente pelo suporte por enquanto.');
    e.target.value = '';
  });
  document.getElementById('btnSair').addEventListener('click', async ()=>{
    if(!confirm('Sair da sua conta?')) return;
    await sbClient.auth.signOut();
    state = {...state, session:null, orgId:null, orgNome:'', contas:[], categorias:[], lancamentos:[], cartoes:[], faturas:[], compras:[], parcelasCartao:[], investimentos:[], aportes:[], compromissos:[], parcelasCompromisso:[], tab:'inicio'};
    render();
  });
  document.getElementById('btnExcluirConta').addEventListener('click', abrirModalExcluirConta);
}
function abrirModalExcluirConta(){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Excluir minha conta</h3>
      <p class="note">Isso apaga para sempre seu login e todos os seus dados: contas, lançamentos, cartões, faturas, investimentos e compromissos. Não tem como desfazer depois. Você pode se cadastrar de novo com o mesmo e-mail no futuro, mas começando do zero.</p>
      <label>Digite EXCLUIR para confirmar</label>
      <input type="text" id="inputConfirmaExclusao" placeholder="EXCLUIR">
      <button class="btn danger" id="btnConfirmarExclusao">Excluir definitivamente</button>
      <button class="btn ghost" id="btnCancelarExclusao" style="margin-top:10px;">Cancelar</button>
    </div>
  </div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') fecharModal(); });
  document.getElementById('btnCancelarExclusao').addEventListener('click', fecharModal);
  document.getElementById('btnConfirmarExclusao').addEventListener('click', async ()=>{
    const val = document.getElementById('inputConfirmaExclusao').value.trim();
    if(val !== 'EXCLUIR'){ showToast('Digite EXCLUIR (maiúsculo) para confirmar.'); return; }
    fecharModal();
    await excluirMinhaConta();
  });
}
async function excluirMinhaConta(){
  showToast('Excluindo sua conta...');
  try{
    const token = state.session.access_token;
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/excluir-conta`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
    });
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok || json.error){
      showToast('Erro ao excluir: ' + (json.error || resp.status));
      return;
    }
    showToast('Conta excluída. Até logo!');
    setTimeout(()=>{ window.location.reload(); }, 1400);
  }catch(e){
    console.error(e);
    showToast('Erro de conexão ao excluir a conta.');
  }
}

/* ============ PÓS-RENDER ============ */
function afterRender(){
  switch(state.tab){
    case 'inicio':
      renderizarChartFluxo();
      renderizarChartGastosCategoria();
      const banner = document.getElementById('bannerDefinirSaldos');
      if(banner) banner.addEventListener('click', ()=>{ state.onboardingSaldos = true; render(); });
      document.querySelectorAll('[data-action="ver-fatura"]').forEach(el=>el.addEventListener('click', ()=>irParaFatura(el.dataset.id)));
      document.querySelectorAll('[data-action="editar-compra"]').forEach(el=>el.addEventListener('click', ()=>abrirModalCompraCartao(el.dataset.cartao, el.dataset.id)));
      document.querySelectorAll('[data-action="editar-lanc"]').forEach(el=>el.addEventListener('click', ()=>abrirModalLancamento(el.dataset.id)));
      document.querySelectorAll('[data-action="ver-categoria"]').forEach(el=>el.addEventListener('click', ()=>abrirExtratoCategoria(el.dataset.cat, mesGastosAtual())));
      const btnTodos = document.getElementById('btnVerTodos');
      if(btnTodos) btnTodos.addEventListener('click', ()=>abrirExtrato());
      const gAnt = document.getElementById('btnGastosAnt'), gProx = document.getElementById('btnGastosProx');
      if(gAnt) gAnt.addEventListener('click', ()=>{ state.mesGastos = addMonthsISO(mesGastosAtual(), -1); render(); });
      if(gProx) gProx.addEventListener('click', ()=>{ state.mesGastos = addMonthsISO(mesGastosAtual(), 1); render(); });
      break;
    case 'lancar': afterRenderLancar(); break;
    case 'cartoes': afterRenderCartoes(); break;
    case 'extrato': afterRenderExtrato(); break;
    case 'relatorios': afterRenderRelatorios(); break;
    case 'mais': afterRenderMais(); break;
    case 'investimentos': afterRenderInvestimentos(); break;
    case 'compromissos': afterRenderCompromissos(); break;
    case 'categorias': afterRenderCategorias(); break;
    case 'contas': afterRenderContas(); break;
    case 'config': afterRenderConfig(); break;
  }
}
document.querySelectorAll('nav.bottomnav button').forEach(b=>{
  b.addEventListener('click', ()=>setTab(b.dataset.tab));
});

/* ============ INICIALIZAÇÃO ============ */
(async function init(){
  const { data } = await sbClient.auth.getSession();
  state.session = data.session;

  sbClient.auth.onAuthStateChange((event, session)=>{
    if(!session && state.session){
      state.session = null;
      state.tab = 'inicio';
      render();
    }
  });

  if(state.session){
    await iniciarAppLogado(false);
  } else {
    render();
  }
})();
</script>
</body>
